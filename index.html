<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pre-Viaje">
<meta name="theme-color" content="#021C4F">
<title>Pre-Viaje Operador</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Saira+Extra+Condensed:wght@700;800&family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ============================================================
   SISTEMA DE DISEÑO · ver design-system/pre-viaje-operador/MASTER.md
   Marca: azul marino del logo ILG (#021C4F → #062661).
   Lenguaje: carretera federal. Asfalto, línea central amarilla,
   escudo de la Ruta 57, señales SIGA (verde) y ALTO (rojo),
   franja de peligro amarillo/negro en bloqueos.
   Tipografía: Saira Extra Condensed 800 (rótulos de impacto),
   Barlow Condensed (títulos de sección), Barlow (cuerpo).
   ============================================================ */
:root {
  --brand: #062661;
  --brand-deep: #021C4F;
  --brand-bright: #1E4DB7;
  --on-brand: #FFFFFF;
  --asfalto: #1B2230;
  --bg: #EEF1F6;
  --card: #FFFFFF;
  --card-2: #F1F4F9;
  --fg: #0B1B3F;
  --fg-2: #4A5A78;
  --border: #D9DFEA;
  --border-2: #B9C3D6;
  --primary: #062661;
  --on-primary: #FFFFFF;
  --accent: #FFC72C;         /* amarillo de línea central */
  --accent-hover: #F2B400;
  --on-accent: #0B1B3F;
  --ok-fill: #0A6B43;        /* verde de señal carretera */
  --ok-text: #0A6B43;
  --ok-bg: #E4F4EB;
  --warn-text: #8A5A00;
  --warn-bg: #FFF3C7;
  --warn-border: #E0A800;
  --danger-fill: #B9131F;    /* rojo ALTO */
  --danger-text: #B9131F;
  --danger-bg: #FDE8EA;
  --info-text: #1E4DB7;
  --info-bg: #E6EDFB;
  --focus: #FFC72C;
  --radius: 8px;
  --radius-sm: 4px;
  --tap: 48px;
  --dur: 160ms;
  --f-impact: 'Saira Extra Condensed', 'Barlow Condensed', 'Arial Narrow', sans-serif;
  --f-display: 'Barlow Condensed', 'Arial Narrow', 'Roboto Condensed', sans-serif;
  --f-body: 'Barlow', 'Segoe UI', Roboto, Arial, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #040B1C; --card: #0B172F; --card-2: #122244;
    --fg: #F1F5F9; --fg-2: #AEBBD6; --border: #1F3159; --border-2: #33497A;
    --primary: #E6ECF7; --on-primary: #0B1B3F;
    --accent: #FFC72C; --accent-hover: #FFD75E; --on-accent: #0B1B3F;
    --ok-fill: #0A6B43; --ok-text: #4ADE80; --ok-bg: #0B2F20;
    --warn-text: #FCD34D; --warn-bg: #2A1F05; --warn-border: #D97706;
    --danger-fill: #B9131F; --danger-text: #FF7B84; --danger-bg: #3A0D12;
    --info-text: #7FA6FF; --info-bg: #0E1F45;
    --asfalto: #0E1526;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #040B1C; --card: #0B172F; --card-2: #122244;
  --fg: #F1F5F9; --fg-2: #AEBBD6; --border: #1F3159; --border-2: #33497A;
  --primary: #E6ECF7; --on-primary: #0B1B3F;
  --accent: #FFC72C; --accent-hover: #FFD75E; --on-accent: #0B1B3F;
  --ok-fill: #0A6B43; --ok-text: #4ADE80; --ok-bg: #0B2F20;
  --warn-text: #FCD34D; --warn-bg: #2A1F05; --warn-border: #D97706;
  --danger-fill: #B9131F; --danger-text: #FF7B84; --danger-bg: #3A0D12;
  --info-text: #7FA6FF; --info-bg: #0E1F45;
  --asfalto: #0E1526;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { height: 100%; }
body {
  margin: 0; min-height: 100%;
  background: var(--bg); color: var(--fg);
  font-family: var(--f-body); font-size: 17px; line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  touch-action: manipulation;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--info-text); }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
[hidden] { display: none !important; }
h1, h2, h3 { margin: 0; font-family: var(--f-display); text-wrap: balance; line-height: 1.05; }
p, ul { margin: 0; }
svg { flex-shrink: 0; }
.ico-20 { width: 20px; height: 20px; }
.ico-24 { width: 24px; height: 24px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- Patrones de carretera ---------- */
.linea-central { height: 6px; background: repeating-linear-gradient(90deg, var(--accent) 0 28px, transparent 28px 44px); }
.franja-peligro { height: 12px; background: repeating-linear-gradient(135deg, var(--accent) 0 14px, var(--asfalto) 14px 28px); }
.franja-alto { height: 12px; background: repeating-linear-gradient(135deg, var(--danger-fill) 0 14px, #FFFFFF 14px 28px); }
.franja-ok { height: 12px; background: var(--ok-fill); border-top: 3px solid #FFFFFF; border-bottom: 3px solid #FFFFFF; }

/* ---------- Cabecera (hero de marca) ---------- */
.cabecera {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10;
  background: radial-gradient(120% 140% at 50% -20%, var(--brand-bright) 0%, var(--brand) 45%, var(--brand-deep) 100%);
  color: var(--on-brand); overflow: hidden;
}
.cabecera-int { max-width: 560px; margin: 0 auto; padding: 8px 16px; display: flex; align-items: center; gap: 12px; position: relative; }
.cabecera-camino { position: absolute; inset: 0; pointer-events: none; opacity: .35; }
.marca { display: flex; align-items: center; gap: 12px; min-width: 0; flex: 1; position: relative; }
.marca img { width: 44px; height: 44px; border-radius: 50%; display: block; flex-shrink: 0; box-shadow: 0 0 0 2px rgba(255,255,255,.25); }
.marca-texto { min-width: 0; line-height: 1; }
.marca-texto .t { font-family: var(--f-impact); font-weight: 800; font-size: clamp(19px, 6vw, 26px); letter-spacing: .03em; text-transform: uppercase; line-height: .95; white-space: nowrap; }
.marca-texto .t em { font-style: normal; color: var(--accent); }
.marca-texto .s { font-size: clamp(8px, 2.6vw, 10px); color: rgba(255,255,255,.78); letter-spacing: .08em; text-transform: uppercase; font-weight: 600; margin-top: 4px; line-height: 1.15; }
.btn-tema {
  min-width: var(--tap); height: var(--tap); border-radius: var(--radius); border: 1px solid rgba(255,255,255,.35);
  background: rgba(255,255,255,.08); color: #FFFFFF; display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  padding: 0 12px; font-size: 14px; font-weight: 600; transition: background var(--dur); position: relative;
}
.btn-tema:hover { background: rgba(255,255,255,.16); }
.btn-tema:focus-visible { outline-color: var(--accent); }

/* Escudo de ruta federal (estilo señalización SCT) */
.escudo { position: relative; width: 40px; height: 46px; flex-shrink: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; padding-top: 4px; color: #0B1B3F; }
.escudo svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.escudo b { position: relative; font-family: var(--f-impact); font-weight: 800; font-size: 20px; line-height: 1; }
.escudo small { position: relative; font-size: 6px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; line-height: 1; margin-bottom: 2px; }

/* ---------- Progreso tipo carretera ---------- */
.progreso { max-width: 560px; margin: 0 auto; padding: 16px 16px 0; }
.carretera { position: relative; height: 34px; background: var(--asfalto); border-radius: 6px; overflow: hidden; border: 2px solid var(--asfalto); }
.carretera::before, .carretera::after { content: ""; position: absolute; left: 0; right: 0; height: 2px; background: #FFFFFF; opacity: .9; }
.carretera::before { top: 2px; } .carretera::after { bottom: 2px; }
.carretera-centro { position: absolute; left: 0; right: 0; top: 50%; height: 4px; transform: translateY(-50%); background: repeating-linear-gradient(90deg, var(--accent) 0 18px, transparent 18px 30px); opacity: .55; }
.carretera-hecho { position: absolute; left: 0; top: 0; bottom: 0; background: rgba(10,107,67,.55); transition: width .35s ease-out; }
.carretera-tramos { position: absolute; inset: 0; display: flex; }
.carretera-tramos span { flex: 1; border-right: 2px dashed rgba(255,255,255,.35); }
.carretera-tramos span:last-child { border-right: 0; }
.carretera-camion { position: absolute; top: 50%; width: 30px; height: 30px; transform: translate(-50%, -50%); color: var(--accent); filter: drop-shadow(0 1px 2px rgba(0,0,0,.6)); transition: left .35s ease-out; display: grid; place-items: center; }
.carretera-camion svg { width: 26px; height: 26px; background: var(--asfalto); border-radius: 50%; padding: 2px; }
.progreso-texto { display: flex; justify-content: space-between; margin-top: 8px; font-size: 13px; color: var(--fg-2); text-transform: uppercase; letter-spacing: .08em; font-weight: 600; }
.progreso-texto b { color: var(--fg); }

/* ---------- Contenido ---------- */
main { max-width: 560px; margin: 0 auto; padding: 24px 16px 136px; }
@media (min-width: 600px) { main, .progreso, .cabecera-int, .pie-int { padding-left: 20px; padding-right: 20px; } }
.etapa { animation: entrar var(--dur) ease-out; }
@keyframes entrar { from { opacity: 0; } to { opacity: 1; } }
.ojal { font-size: 13px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--fg-2); margin-bottom: 4px; }
.titulo { font-family: var(--f-impact); font-size: 44px; font-weight: 800; text-transform: uppercase; letter-spacing: .02em; line-height: .95; }
.titulo::after { content: ""; display: block; width: 56px; height: 5px; background: var(--accent); margin-top: 10px; border-radius: 2px; }
.subtitulo { color: var(--fg-2); margin-top: 10px; max-width: 60ch; }
.pila { display: flex; flex-direction: column; gap: 16px; }
.pila-24 { display: flex; flex-direction: column; gap: 24px; }
.tarjeta { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; }
.tarjeta-titulo { display: flex; align-items: center; gap: 10px; font-weight: 600; }
.tarjeta-titulo .ico { width: 40px; height: 40px; border-radius: var(--radius); background: var(--brand); color: var(--accent); display: grid; place-items: center; flex-shrink: 0; }
.tarjeta-titulo .ico svg { width: 24px; height: 24px; }

/* Campos */
.campo { display: flex; flex-direction: column; gap: 6px; }
.campo label { font-size: 14px; font-weight: 600; color: var(--fg); }
.campo label .req { color: var(--danger-text); }
.campo input, .campo select {
  min-height: var(--tap); padding: 10px 14px; border-radius: var(--radius);
  border: 1px solid var(--border-2); background: var(--card); color: var(--fg); width: 100%;
  transition: border-color var(--dur);
}
.campo input:focus { outline: none; border-color: var(--brand-bright); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 45%, transparent); }
.campo input[readonly] { background: var(--card-2); color: var(--fg-2); border-style: dashed; }
.campo input[aria-invalid="true"] { border-color: var(--danger-text); border-width: 2px; }
.ayuda { font-size: 14px; color: var(--fg-2); }
.error-linea { display: flex; gap: 6px; align-items: flex-start; font-size: 14px; color: var(--danger-text); font-weight: 500; }
.error-linea svg { width: 18px; height: 18px; margin-top: 2px; }
.fila-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
@media (max-width: 420px) { .fila-2 { grid-template-columns: 1fr; } }

/* Preguntas */
.pregunta { padding: 16px 0; border-bottom: 1px solid var(--border); scroll-margin-top: 96px; }
.pregunta:first-child { padding-top: 0; }
.pregunta:last-child { border-bottom: 0; padding-bottom: 0; }
.pregunta-texto { font-weight: 600; font-size: 18px; margin-bottom: 12px; }
.pregunta-texto small { display: block; font-weight: 400; font-size: 14px; color: var(--fg-2); margin-top: 2px; }
.pregunta.error .pregunta-texto { color: var(--danger-text); }
.opciones { display: flex; gap: 8px; flex-wrap: wrap; }
.opcion {
  flex: 1 1 calc(50% - 8px); min-height: var(--tap); min-width: 0;
  border: 1px solid var(--border-2); border-radius: var(--radius); background: var(--card-2); color: var(--fg);
  font-weight: 600; font-size: 17px; padding: 8px 12px; position: relative;
  display: flex; align-items: center; justify-content: center; gap: 8px;
  transition: background var(--dur), border-color var(--dur), color var(--dur);
}
.opcion svg { width: 20px; height: 20px; }
.opcion:hover { border-color: var(--brand-bright); }
.opcion:active { background: var(--border); }
.opcion[aria-pressed="true"] { background: var(--primary); color: var(--on-primary); border-color: var(--primary); }
.opcion .sel { position: absolute; top: 4px; right: 6px; opacity: 0; display: inline-flex; color: var(--accent); }
.opcion .sel svg { width: 14px; height: 14px; }
.opcion[aria-pressed="true"] .sel { opacity: 1; }
.escala { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
.escala .opcion { flex: unset; font-family: var(--f-impact); font-size: 26px; font-weight: 800; padding: 0; }
.escala-ext { display: flex; justify-content: space-between; margin-top: 6px; font-size: 13px; color: var(--fg-2); }
.pregunta .error-linea { margin-top: 8px; }

/* Avisos */
.aviso { display: flex; gap: 12px; padding: 12px 14px; border-radius: var(--radius); border: 1px solid; align-items: flex-start; font-size: 15px; }
.aviso svg { width: 22px; height: 22px; margin-top: 1px; }
.aviso b { display: block; font-weight: 600; }
.aviso.info { background: var(--info-bg); border-color: var(--info-text); color: var(--fg); }
.aviso.info svg { color: var(--info-text); }
.aviso.warn { background: var(--warn-bg); border-color: var(--warn-border); color: var(--fg); }
.aviso.warn svg { color: var(--warn-text); }
.aviso.ok { background: var(--ok-bg); border-color: var(--ok-text); color: var(--fg); }
.aviso.ok svg { color: var(--ok-text); }
.aviso.danger { background: var(--danger-bg); border-color: var(--danger-text); color: var(--fg); }
.aviso.danger svg { color: var(--danger-text); }
.resumen-errores { background: var(--danger-bg); border: 2px solid var(--danger-text); border-radius: var(--radius); padding: 14px; }
.resumen-errores h2 { font-size: 20px; text-transform: uppercase; color: var(--danger-text); display: flex; align-items: center; gap: 8px; }
.resumen-errores h2 svg { width: 22px; height: 22px; }
.resumen-errores ul { list-style: none; padding: 0; margin: 8px 0 0; display: flex; flex-direction: column; gap: 4px; }
.resumen-errores a { color: var(--danger-text); font-weight: 500; min-height: 32px; display: inline-flex; align-items: center; }

/* Botones */
.btn {
  min-height: var(--tap); padding: 10px 20px; border-radius: var(--radius); border: 1px solid transparent;
  font-weight: 700; font-size: 17px; display: inline-flex; align-items: center; justify-content: center; gap: 10px;
  width: 100%; transition: background var(--dur), border-color var(--dur), color var(--dur), opacity var(--dur);
  text-decoration: none; text-transform: uppercase; letter-spacing: .03em; font-family: var(--f-display); font-size: 19px;
}
.btn svg { width: 20px; height: 20px; }
.btn.primario { background: var(--accent); color: var(--on-accent); }
.btn.primario:hover { background: var(--accent-hover); }
.btn.secundario { background: var(--primary); color: var(--on-primary); }
.btn.secundario:hover { opacity: .9; }
.btn.ok { background: var(--ok-fill); color: #FFFFFF; }
.btn.ok:hover { opacity: .9; }
.btn.fantasma { background: var(--card); border-color: var(--border-2); color: var(--fg); }
.btn.fantasma:hover { background: var(--card-2); }
.btn:active { opacity: .8; }
.btn[disabled], .btn[aria-busy="true"] { opacity: .5; cursor: not-allowed; }
.btn-chico { min-height: 40px; padding: 6px 12px; font-size: 14px; width: auto; text-transform: none; font-family: var(--f-body); letter-spacing: 0; }
.spinner { width: 20px; height: 20px; border: 3px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: girar .8s linear infinite; display: inline-block; }
@keyframes girar { to { transform: rotate(360deg); } }

/* Pie fijo (acotamiento) */
.pie {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
  background: var(--card); border-top: 1px solid var(--border);
  padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0px));
}
.pie .linea-central { position: absolute; left: 0; right: 0; top: 0; height: 4px; }
.pie-int { max-width: 560px; margin: 0 auto; display: flex; gap: 8px; align-items: center; }
.pie-int .btn.fantasma { width: auto; flex: 0 0 auto; padding-inline: 16px; }
.pie-estado { font-size: 13px; color: var(--fg-2); text-align: center; margin-top: 6px; display: flex; justify-content: center; align-items: center; gap: 6px; }
.pie-estado svg { width: 16px; height: 16px; }
.pie-estado.ok { color: var(--ok-text); }

/* ---------- Barrera GPS ---------- */
.bitacora { font-size: 15px; color: var(--fg-2); display: flex; flex-direction: column; gap: 8px; }
.bitacora:empty { display: none; }
.bitacora div { display: flex; gap: 8px; align-items: flex-start; }
.bitacora svg { width: 18px; height: 18px; margin-top: 3px; }
.bitacora .ok { color: var(--ok-text); }
.bitacora .mal { color: var(--danger-text); }
.bitacora .espera { color: var(--info-text); display: inline-flex; animation: girar .8s linear infinite; }
.bitacora b { color: var(--fg); }

.tablero { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
.indicador { background: var(--card-2); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px; min-width: 0; }
.indicador .k { font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--fg-2); }
.indicador .v { font-family: var(--f-impact); font-size: 40px; font-weight: 800; line-height: 1; margin-top: 6px; font-variant-numeric: tabular-nums; }
.indicador .v small { font-size: 16px; font-weight: 600; color: var(--fg-2); margin-left: 4px; font-family: var(--f-body); }
.indicador .d { font-size: 14px; color: var(--fg-2); margin-top: 4px; }
.indicador .d.fuerte { color: var(--fg); font-weight: 500; font-size: 15px; margin-top: 8px; }
.indicador.ancho { grid-column: 1 / -1; }
.medidor { height: 14px; border-radius: 4px; background: var(--asfalto); overflow: hidden; margin-top: 10px; position: relative; }
.medidor::after { content: ""; position: absolute; left: 0; right: 0; top: 50%; height: 2px; transform: translateY(-50%); background: repeating-linear-gradient(90deg, rgba(255,255,255,.7) 0 10px, transparent 10px 18px); pointer-events: none; }
.medidor > i { display: block; height: 100%; background: var(--ok-fill); transition: width .4s ease-out; }
.medidor > i.warn { background: var(--accent); }
.medidor > i.danger { background: var(--danger-fill); }
.medidor-marcas { display: flex; justify-content: space-between; font-size: 12px; color: var(--fg-2); margin-top: 4px; font-variant-numeric: tabular-nums; }

.estado-card { border-radius: var(--radius); overflow: hidden; border: 2px solid; background: var(--card); }
.estado-card.bloqueo { border-color: var(--danger-text); }
.estado-card.permiso { border-color: var(--ok-text); }
.estado-cuerpo { padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.estado-cuerpo h2 { font-family: var(--f-impact); font-size: 36px; font-weight: 800; text-transform: uppercase; display: flex; align-items: center; gap: 10px; line-height: .95; }
.estado-card.bloqueo h2 { color: var(--danger-text); }
.estado-card.permiso h2 { color: var(--ok-text); }
.estado-cuerpo h2 svg { width: 32px; height: 32px; }
.cuenta { background: var(--asfalto); color: #FFFFFF; border-radius: var(--radius); padding: 14px; text-align: center; position: relative; overflow: hidden; }
.cuenta::before { content: ""; position: absolute; left: 10px; right: 10px; top: 8px; height: 2px; background: repeating-linear-gradient(90deg, var(--accent) 0 16px, transparent 16px 26px); opacity: .7; }
.cuenta .k { font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: rgba(255,255,255,.75); margin-top: 6px; }
.cuenta .reloj { font-family: var(--f-impact); font-size: 64px; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; margin: 6px 0; color: var(--accent); }
.cuenta .h { font-size: 15px; color: rgba(255,255,255,.85); }
.cuenta .h b { color: #FFFFFF; }
.texto-2 { font-size: 15px; color: var(--fg-2); }
.demo { font-size: 14px; color: var(--fg-2); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.demo select { min-height: 40px; border-radius: var(--radius-sm); border: 1px solid var(--border-2); background: var(--card); padding: 6px 8px; font-size: 14px; max-width: 100%; }

/* Confirmación */
.resumen { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 16px; font-size: 15px; margin-top: 8px; }
.resumen .k { color: var(--fg-2); font-size: 12px; text-transform: uppercase; letter-spacing: .08em; font-weight: 600; }
.resumen .v { font-weight: 500; overflow-wrap: anywhere; }
.casilla { display: flex; gap: 12px; align-items: flex-start; padding: 14px; border: 1px solid var(--border-2); border-radius: var(--radius); background: var(--card); cursor: pointer; }
.casilla input { width: 24px; height: 24px; margin: 2px 0 0; accent-color: var(--ok-fill); flex-shrink: 0; }
.casilla span { font-size: 15px; }
.casilla.error { border-color: var(--danger-text); border-width: 2px; }
.firma { border: 1px dashed var(--border-2); border-radius: var(--radius); background: var(--card-2); position: relative; }
.firma canvas { width: 100%; height: 140px; display: block; touch-action: none; border-radius: var(--radius); }
.firma .pista { position: absolute; left: 0; right: 0; bottom: 8px; text-align: center; font-size: 14px; color: var(--fg-2); pointer-events: none; }
.firma .limpiar { position: absolute; top: 6px; right: 6px; }
.firma.error { border-color: var(--danger-text); border-width: 2px; }

/* Resultado: señales de carretera */
.letrero { border-radius: 14px; padding: 28px 20px 22px; text-align: center; color: #FFFFFF; position: relative; }
.letrero::after { content: ""; position: absolute; inset: 7px; border: 3px solid rgba(255,255,255,.9); border-radius: 9px; pointer-events: none; }
.letrero.apto { background: var(--ok-fill); }
.letrero.noapto { background: var(--danger-fill); }
.letrero .ojal { color: rgba(255,255,255,.9); }
.letrero h2 { font-family: var(--f-impact); font-size: 84px; font-weight: 800; text-transform: uppercase; letter-spacing: .02em; line-height: .9; display: flex; align-items: center; justify-content: center; gap: 12px; flex-wrap: wrap; }
.letrero h2 svg { width: 56px; height: 56px; }
.letrero .senal { display: inline-block; font-family: var(--f-impact); font-weight: 800; font-size: 20px; letter-spacing: .2em; text-transform: uppercase; padding: 2px 12px; border: 2px solid rgba(255,255,255,.9); border-radius: 4px; margin-bottom: 10px; }
.letrero p { margin-top: 10px; font-size: 18px; font-weight: 500; }
.letrero .folio { margin-top: 12px; font-size: 13px; opacity: .9; letter-spacing: .08em; text-transform: uppercase; font-variant-numeric: tabular-nums; }
.factores { list-style: none; margin: 8px 0 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.factores li { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border-radius: var(--radius); background: var(--card-2); border: 1px solid var(--border); font-size: 15px; }
.sev { flex-shrink: 0; font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; padding: 3px 7px; border-radius: var(--radius-sm); margin-top: 2px; display: inline-flex; align-items: center; gap: 4px; }
.sev svg { width: 12px; height: 12px; }
.sev.critico { background: var(--danger-fill); color: #FFFFFF; }
.sev.riesgo { background: var(--accent); color: var(--on-accent); }
.acciones { display: flex; flex-direction: column; gap: 8px; }
.historial { font-size: 14px; color: var(--fg-2); }
.historial ul { list-style: none; padding: 0; margin: 8px 0 0; }
.historial li { display: flex; justify-content: space-between; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--border); align-items: center; }
.historial li:last-child { border-bottom: 0; }
.etiqueta { font-size: 12px; font-weight: 600; letter-spacing: .06em; padding: 3px 8px; border-radius: var(--radius-sm); text-transform: uppercase; flex-shrink: 0; display: inline-flex; align-items: center; gap: 4px; }
.etiqueta svg { width: 12px; height: 12px; }
.etiqueta.apto { background: var(--ok-bg); color: var(--ok-text); }
.etiqueta.noapto { background: var(--danger-bg); color: var(--danger-text); }
.aviso-toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(112px + env(safe-area-inset-bottom, 0px)); background: var(--primary); color: var(--on-primary); padding: 10px 16px; border-radius: var(--radius); font-size: 14px; z-index: 20; max-width: calc(100% - 32px); }

/* ---------- Inicio y horas de servicio (HoS) ---------- */
.inicio-hero { background: radial-gradient(120% 140% at 50% -20%, var(--brand-bright) 0%, var(--brand) 45%, var(--brand-deep) 100%); color: #FFFFFF; border-radius: 14px; padding: 20px 18px; display: flex; flex-direction: column; gap: 14px; position: relative; overflow: hidden; }
.inicio-hero::after { content: ""; position: absolute; left: 14px; right: 14px; bottom: 10px; height: 3px; background: repeating-linear-gradient(90deg, var(--accent) 0 18px, transparent 18px 30px); opacity: .8; }
.inicio-hero .ojal { color: rgba(255,255,255,.75); }
.inicio-hero.compacta h1 { font-size: 26px; }
.inicio-hero.compacta .chips { display: none; }
.inicio-hero h1 { font-family: var(--f-impact); font-weight: 800; font-size: 40px; text-transform: uppercase; line-height: .95; letter-spacing: .02em; }
.inicio-hero h1 em { font-style: normal; color: var(--accent); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; padding-bottom: 8px; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 999px; background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.25); font-size: 13px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; }
.chip svg { width: 14px; height: 14px; }
.operador-resumen { display: flex; align-items: center; gap: 12px; }
.operador-resumen .avatar { width: 44px; height: 44px; border-radius: 50%; background: var(--brand); color: var(--accent); display: grid; place-items: center; font-family: var(--f-impact); font-weight: 800; font-size: 20px; flex-shrink: 0; }
.operador-resumen .txt { flex: 1; min-width: 0; line-height: 1.2; }
.operador-resumen .txt b { display: block; font-size: 17px; overflow-wrap: anywhere; }
.operador-resumen .txt span { font-size: 14px; color: var(--fg-2); }
.hos-cab { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.hos-cab .ojal { margin: 0; }
.hos-vivo { font-size: 12px; color: var(--fg-2); display: inline-flex; align-items: center; gap: 6px; }
.hos-vivo i { width: 8px; height: 8px; border-radius: 50%; background: var(--ok-text); display: inline-block; animation: latido 1.6s infinite; }
@keyframes latido { 50% { opacity: .25; } }
.hos { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin-top: 12px; }
@media (max-width: 400px) { .hos { grid-template-columns: repeat(5, 1fr); gap: 4px; } }
.hos-item { display: flex; flex-direction: column; align-items: center; text-align: center; min-width: 0; }
.estado-tile { width: 100%; max-width: 56px; aspect-ratio: 1; height: auto; border-radius: 10px; display: grid; place-items: center; font-family: var(--f-impact); font-weight: 800; font-size: 18px; letter-spacing: .04em; color: #FFFFFF; background: #6B7280; }
.estado-tile.on { background: var(--brand-bright); }
.anillo { position: relative; width: 100%; max-width: 56px; aspect-ratio: 1; }
.anillo svg { width: 100%; height: 100%; transform: rotate(-90deg); display: block; }
.anillo .pista { fill: none; stroke: var(--border); stroke-width: 6; }
.anillo .valor { fill: none; stroke: var(--brand-bright); stroke-width: 6; stroke-linecap: round; transition: stroke-dasharray .5s ease-out; }
.anillo.warn .valor { stroke: var(--accent); }
.anillo.danger .valor { stroke: var(--danger-fill); }
.anillo.ok .valor { stroke: var(--ok-fill); }
.anillo .anillo-ico { position: absolute; inset: 0; display: grid; place-items: center; color: var(--fg-2); }
.anillo .anillo-ico svg { width: 18px; height: 18px; transform: none; }
.hos-v { font-family: var(--f-impact); font-weight: 800; font-size: clamp(14px, 4.4vw, 19px); line-height: 1; margin-top: 8px; font-variant-numeric: tabular-nums; max-width: 100%; overflow-wrap: anywhere; }
.hos-v.cron { font-size: clamp(12px, 3.6vw, 16px); letter-spacing: -.02em; }
.hos-k { font-size: clamp(9px, 2.7vw, 11px); font-weight: 600; color: var(--fg-2); text-transform: uppercase; letter-spacing: 0; margin-top: 3px; max-width: 100%; }
.hos-sub { font-size: 10px; color: var(--fg-2); margin-top: 1px; font-variant-numeric: tabular-nums; }
.hos-leyenda { display: flex; flex-wrap: wrap; gap: 8px 14px; margin-top: 12px; font-size: 13px; color: var(--fg-2); }
.hos-leyenda span { display: inline-flex; align-items: center; gap: 6px; }
.hos-leyenda i { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
.hos-leyenda .l-ok i { background: var(--ok-fill); } .hos-leyenda .l-warn i { background: var(--accent); } .hos-leyenda .l-danger i { background: var(--danger-fill); } .hos-leyenda .l-az i { background: var(--brand-bright); }
/* Cabecera de sección con señal y poste kilométrico */
.seccion-cab { display: flex; align-items: center; gap: 14px; }
.senal-svg { width: 72px; height: 72px; flex-shrink: 0; filter: drop-shadow(0 2px 2px rgba(0,0,0,.18)); }
.seccion-txt { min-width: 0; flex: 1; }
.seccion-txt .titulo { font-size: clamp(30px, 9vw, 40px); }
.seccion-txt .ojal { display: flex; align-items: center; gap: 8px; }
.poste { display: inline-flex; flex-direction: column; align-items: center; justify-content: center; width: 30px; height: 30px; border-radius: 4px 4px 2px 2px; background: #FFFFFF; border: 2px solid #0B1B3F; color: #0B1B3F; line-height: 1; font-family: var(--f-impact); }
.poste b { font-size: 7px; letter-spacing: .05em; font-weight: 700; }
.poste i { font-style: normal; font-size: 15px; font-weight: 800; }
/* Compromiso */
.compromiso { background: var(--warn-bg); border-left: 5px solid var(--warn-border); border-radius: var(--radius); padding: 16px; display: flex; flex-direction: column; gap: 12px; font-size: 16px; line-height: 1.55; }
.compromiso .ojal { color: var(--warn-text); font-family: var(--f-display); font-size: 20px; letter-spacing: .02em; }
.compromiso p b { font-weight: 600; }
.compromiso .casilla { margin-top: 4px; background: var(--card); }
/* Identificación */
.foto-marco { aspect-ratio: 4 / 3; border-radius: var(--radius); background: var(--card-2); border: 1px dashed var(--border-2); overflow: hidden; display: grid; place-items: center; }
.foto-marco img { width: 100%; height: 100%; object-fit: cover; display: block; }
.foto-vacia { display: flex; flex-direction: column; align-items: center; gap: 6px; color: var(--fg-2); font-size: 14px; text-align: center; padding: 8px; }
.foto-vacia svg { width: 36px; height: 36px; }
.ubi-dato { display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center; font-size: 14px; padding: 8px; }
.ubi-dato b { font-family: var(--f-impact); font-size: 20px; font-variant-numeric: tabular-nums; }
.ubi-dato span { color: var(--fg-2); }
.estado-permiso { font-size: 13px; color: var(--fg-2); display: flex; align-items: center; gap: 6px; }
.estado-permiso svg { width: 16px; height: 16px; }
.tarjeta.error { border-color: var(--danger-text); border-width: 2px; }
.foto-mini { width: 44px; height: 44px; border-radius: 6px; object-fit: cover; display: block; }
.foto-mini.grande { width: 72px; height: 72px; border-radius: 8px; flex-shrink: 0; }
.foto-mini.vacia { display: grid; place-items: center; background: var(--card-2); color: var(--fg-2); }
.foto-mini.vacia svg { width: 28px; height: 28px; }
.identidad { display: flex; gap: 14px; align-items: center; }
.identidad-txt { display: flex; flex-direction: column; gap: 2px; font-size: 14px; color: var(--fg-2); min-width: 0; }
.identidad-txt b { font-size: 17px; color: var(--fg); }
.identidad-txt span { display: flex; align-items: center; gap: 6px; overflow-wrap: anywhere; }
.identidad-txt svg { width: 14px; height: 14px; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>

<script>
/* =====================================================================

   ===================================================================== */
const REGLAS = {
  maxConduccion: 14,     // h de conducción continua. Al llegar aquí: descanso obligatorio
  descansoEfectivo: 8,   // h mínimas de descanso efectivo tras alcanzar el máximo

/* =====================================================================
   PROVEEDOR GPS
   En producción, reemplace `consultarActividad` por la llamada a la
   plataforma de telemetría (Geotab, Samsara, Webfleet, Copiloto, etc.):
   debe devolver { unidad, ubicacion:{lat,lon,texto}, desde:Date, segmentos:[{inicio:Date, fin:Date}] }
   con los periodos de conducción (motor en movimiento) desde `desde` (últimas 36 h).
   ===================================================================== */
const DEMO = {
  'T-118': { nombre: 'Jornada normal, descanso cumplido', ubicacion: 'Patio Querétaro, Qro. (Ruta 57)', seg: [[30,26],[25.5,22],[13,9.5],[9,4.5],[4,1]] },
  'T-311': { nombre: 'Cerca del límite de 14 h',          ubicacion: 'Km 118 Ruta 57, Matehuala, S.L.P.', seg: [[28,26],[15,8],[7.5,1.5]] },
  'T-204': { nombre: 'Excedió 14 h continuas',            ubicacion: 'Parador Ruta 57, Saltillo, Coah.', seg: [[33,30],[20,12],[11.5,4]] },

  'T-422': { nombre: '6 h seguidas sin pausa de 30 min', ubicacion: 'Km 212 Ruta 57, El Huizache, S.L.P.', seg: [[30,28],[6.2,0.15]] },
  'T-500': { nombre: 'Sin señal GPS',                     ubicacion: null, seg: null }
};
const GPS_PROVIDER = {
  async consultarActividad(economico) {
    await esperar(900);
    const eco = economico.trim().toUpperCase();
    const d = DEMO[eco];
    if (!d) throw new Error('La unidad ' + eco + ' no está registrada en la plataforma GPS.');
    if (!d.seg) throw new Error('La unidad ' + eco + ' no reporta señal desde hace más de 2 horas.');
    const ahora = Date.now();
    return {
      unidad: eco,

/* =====================================================================
   ANÁLISIS DE HORAS DE CONDUCCIÓN
   ===================================================================== */
function analizarActividad(segmentos, ahora = new Date(), desde = null) {
  const H = 3600e3;
  const segs = [...segmentos].sort((a, b) => a.inicio - b.inicio);
  const jornadas = [];
  let actual = null, prevFin = null, ultimoDescanso = null, tramo = 0;
  if (desde && segs.length && (segs[0].inicio - desde) / H >= REGLAS.descansoEfectivo) {
    ultimoDescanso = { inicio: desde, fin: segs[0].inicio, horas: (segs[0].inicio - desde) / H, enCurso: false };
  }
  for (const s of segs) {
    if (prevFin) {
      const pausa = (s.inicio - prevFin) / H;
      if (pausa >= REGLAS.pausaCorta) tramo = 0;
      if (pausa >= REGLAS.pausaReinicio && actual) { jornadas.push(actual); actual = null; }
      if (pausa >= REGLAS.descansoEfectivo) ultimoDescanso = { inicio: prevFin, fin: s.inicio, horas: pausa, enCurso: false };
    }
    if (!actual) actual = { inicio: s.inicio, fin: s.fin, horas: 0 };
    actual.horas += (s.fin - s.inicio) / H;
    tramo += (s.fin - s.inicio) / H;
    actual.fin = s.fin;
    prevFin = s.fin;
  }
  if (actual) jornadas.push(actual);
  const ultima = jornadas[jornadas.length - 1];
  const pausaActual = prevFin ? (ahora - prevFin) / H : Infinity;
  if (prevFin && pausaActual >= REGLAS.descansoEfectivo) ultimoDescanso = { inicio: prevFin, fin: null, horas: pausaActual, enCurso: true };

  const descansoVigente = !!ultimoDescanso && (ultimoDescanso.enCurso || (ahora - ultimoDescanso.fin) / H <= REGLAS.ventanaDescanso);
  const jornadaAbierta = !!ultima && pausaActual < REGLAS.pausaReinicio;
  const horasJornada = jornadaAbierta ? ultima.horas : 0;
  const alcanzoMaximo = !!ultima && ultima.horas >= REGLAS.maxConduccion && pausaActual < REGLAS.descansoEfectivo;
  const horasSinPausa = (jornadaAbierta && pausaActual < REGLAS.pausaCorta) ? tramo : 0;
  const pausaCortaPendiente = horasSinPausa >= REGLAS.conduccionSinPausa;

  const r = { horasJornada, horasUltimaJornada: ultima ? ultima.horas : 0, pausaActual, ultimoDescanso, descansoVigente, jornadaAbierta,
              restante: Math.max(0, REGLAS.maxConduccion - horasJornada), estado: 'permitido', motivo: '', esperaHoras: 0, advertencia: '',
              horasSinPausa, pausaCortaPendiente, pausaCortaFalta: pausaCortaPendiente ? Math.max(0, REGLAS.pausaCorta - (isFinite(pausaActual) ? pausaActual : 0)) : 0 };

  if (alcanzoMaximo) {
    r.estado = 'bloqueado';
    r.codigo = 'MAX_CONDUCCION';
    r.motivo = 'Condujo ' + fmtH(ultima.horas) + ' continuas y el máximo es ' + REGLAS.maxConduccion + ' h. Le corresponde un descanso efectivo mínimo de ' + REGLAS.descansoEfectivo + ' h.';
    r.esperaHoras = REGLAS.descansoEfectivo - pausaActual;
  } else if (!descansoVigente) {
    r.estado = 'bloqueado';
    r.codigo = 'SIN_DESCANSO_24H';
    r.motivo = 'No registra un descanso efectivo de ' + REGLAS.descansoEfectivo + ' h dentro de las últimas ' + REGLAS.ventanaDescanso + ' h. Debe completar su descanso antes de evaluarse.';
    r.esperaHoras = Math.max(0, REGLAS.descansoEfectivo - (isFinite(pausaActual) ? pausaActual : 0));
  } else if (pausaCortaPendiente && REGLAS.pausaCortaBloquea) {
    r.estado = 'bloqueado';
    r.codigo = 'PAUSA_CORTA';
    r.motivo = 'Lleva ' + fmtH(horasSinPausa) + ' de manejo sin una pausa de ' + Math.round(REGLAS.pausaCorta * 60) + ' min. Complete la pausa antes de evaluarse.';
    r.esperaHoras = r.pausaCortaFalta;
  } else {
    const avisos = [];
    if (pausaCortaPendiente) avisos.push('Lleva ' + fmtH(horasSinPausa) + ' de manejo seguidas. Tome una pausa de ' + Math.round(REGLAS.pausaCorta * 60) + ' min antes de salir; le faltan ' + fmtH(r.pausaCortaFalta) + '.');
    if (r.restante <= REGLAS.avisoRestante) avisos.push('Le queda' + (r.restante === 1 ? '' : 'n') + ' ' + fmtH(r.restante) + ' de conducción antes del descanso obligatorio. Planee su parada.');
    r.advertencia = avisos.join(' ');
  }
  return r;
}
function fmtH(h) {
  if (!isFinite(h)) return '—';
  const hh = Math.floor(h + 1e-9), mm = Math.round((h - hh) * 60);
  if (mm === 60) return (hh + 1) + ' h';
  return mm ? hh + ' h ' + String(mm).padStart(2, '0') + ' min' : hh + ' h';
}

    html += '<div class="tarjeta operador-resumen"><div class="avatar" aria-hidden="true">' + esc(iniciales(d.nombre)) + '</div><div class="txt"><b>' + esc(d.nombre) + '</b><span>Unidad ' + esc(d.economico) + ' · ' + esc(g.ubicacion) + '</span></div><button class="btn fantasma btn-chico" id="btnCambiar" type="button">Cambiar</button></div>';
  }
  html += '<div id="veredictoGps"></div>';
  html += renderHistorialCorto();
  html += '</section>';
  vista.innerHTML = html;

  if (!g) {
    $('#selDemo').addEventListener('change', e => { if (e.target.value) { $('#ecoGps').value = e.target.value; if (!$('#iNombre').value.trim()) $('#iNombre').value = 'Operador de prueba'; conectarGps(); } });
    $('#btnConectar').addEventListener('click', conectarGps);
    $('#ecoGps').addEventListener('keydown', e => { if (e.key === 'Enter') conectarGps(); });
    $('#ecoGps').addEventListener('input', () => { $('#ecoError').innerHTML = ''; $('#ecoGps').removeAttribute('aria-invalid'); });
    $('#iNombre').addEventListener('input', e => { estado.datos.nombre = e.target.value; $('#iNombreErr').innerHTML = ''; $('#iNombre').removeAttribute('aria-invalid'); });
  } else {
    $('#btnCambiar').addEventListener('click', () => { estado.gps = null; render(); });
    pintarVeredictoGps();
  }
}
const iniciales = n => n.trim().split(/\s+/).slice(0, 2).map(x => x[0] || '').join('').toUpperCase() || '·';

function log(texto, clase) {
  const b = $('#bitacora'); if (!b) return;
  const ico = clase === 'ok' ? ICONO.checkCirculo : clase === 'mal' ? ICONO.xOctagono : ICONO.cargando;
  b.insertAdjacentHTML('beforeend', '<div><span class="' + (clase || 'espera') + '">' + ico + '</span><span>' + texto + '</span></div>');
}
function reemplazarUltimoLog(texto, clase) {
  const b = $('#bitacora'); if (!b || !b.lastElementChild) return;
  b.lastElementChild.remove(); log(texto, clase);
}
function ocupado(btn, icoId, txtId, activo, txtActivo, txtNormal, icoNormal) {
  btn.setAttribute('aria-busy', String(activo));
  btn.disabled = activo;
  $('#' + icoId).innerHTML = activo ? '<span class="spinner" aria-hidden="true"></span>' : icoNormal;
  $('#' + txtId).textContent = activo ? txtActivo : txtNormal;
}

async function conectarGps() {
  const inp = $('#ecoGps'), nom = $('#iNombre'), eco = inp.value.trim().toUpperCase();
  let ok = true;
  if (nom.value.trim().length < 5) {
    nom.setAttribute('aria-invalid', 'true'); $('#iNombreErr').innerHTML = errorLinea('iNombreErrTxt', 'Escriba su nombre y apellidos completos.'); nom.focus(); ok = false;
  }
  if (!eco) {
    inp.setAttribute('aria-invalid', 'true'); inp.setAttribute('aria-describedby', 'ecoAyuda ecoErrorTxt');
    $('#ecoError').innerHTML = errorLinea('ecoErrorTxt', 'Escriba el número económico para consultar sus horas de servicio.');
    if (ok) inp.focus(); ok = false;
  }
  if (!ok) return;
  estado.datos.nombre = nom.value.trim();
  const btn = $('#btnConectar');
  ocupado(btn, 'btnConectarIco', 'btnConectarTxt', true, 'Consultando horas de servicio…', 'Iniciar evaluación', ICONO.check);
  $('#bitacora').innerHTML = ''; $('#veredictoGps').innerHTML = '';
  estado.datos.economico = eco; estado.gps = null;
  log('Buscando la unidad <b>' + esc(eco) + '</b> en la plataforma GPS…');

  if (navigator.geolocation && !estado.posicion) {
    navigator.geolocation.getCurrentPosition(p => { estado.posicion = { lat: p.coords.latitude, lon: p.coords.longitude }; }, () => {}, { timeout: 5000, maximumAge: 60000 });
  }

  try {
    const r = await GPS_PROVIDER.consultarActividad(eco);
    reemplazarUltimoLog('Unidad <b>' + esc(r.unidad) + '</b> encontrada · ' + esc(r.ubicacion.texto), 'ok');
    log('Leyendo horas de servicio de las últimas 36 h…');
    await esperar(600);
    const a = analizarActividad(r.segmentos, new Date(), r.desde);
    estado.gps = { unidad: r.unidad, ubicacion: r.ubicacion.texto, segmentos: r.segmentos, desde: r.desde, analisis: a, origen: 'gps', consultadoEn: new Date() };
    render();
  } catch (err) {
    reemplazarUltimoLog(esc(err.message), 'mal');
    ocupado(btn, 'btnConectarIco', 'btnConectarTxt', false, '', 'Iniciar evaluación', ICONO.check);
    pintarFalloGps();
  }
}

function pintarFalloGps() {
  $('#veredictoGps').innerHTML =
    '<div class="pila">' +
    '<div class="aviso warn" role="alert">' + ICONO.alerta + '<div><b>No se pudo verificar con el GPS</b>Revise el número económico e intente de nuevo. Si la unidad no tiene señal, registre sus horas de forma manual; la evaluación quedará marcada para validación de Cabina de Seguridad.</div></div>' +
    '<div class="tarjeta pila" id="manualBox">' +
      '<div class="tarjeta-titulo"><span class="ico">' + ICONO.reloj + '</span><div>Registro manual de horas</div></div>' +
      '<div class="campo"><label for="mFinDescanso">¿A qué hora terminó su último descanso de ' + REGLAS.descansoEfectivo + ' h o más? <span class="req" aria-hidden="true">*</span></label><input id="mFinDescanso" type="datetime-local"><div id="mFinDescansoErr"></div></div>' +
      '<div class="campo"><label for="mHoras">¿Cuántas horas ha manejado desde ese descanso? <span class="req" aria-hidden="true">*</span></label><input id="mHoras" type="number" inputmode="decimal" min="0" max="24" step="0.5" placeholder="Ej. 6.5"><div id="mHorasErr"></div></div>' +
      '<div class="campo"><label for="mPausa">¿Hace cuántas horas apagó la unidad por última vez? <span class="req" aria-hidden="true">*</span></label><input id="mPausa" type="number" inputmode="decimal" min="0" max="24" step="0.5" placeholder="Ej. 0.5" aria-describedby="mPausaAyuda"><div class="ayuda" id="mPausaAyuda">Ponga 0 si acaba de detenerse.</div><div id="mPausaErr"></div></div>' +
      '<button class="btn primario" id="btnManual" type="button">Registrar horas declaradas</button>' +
    '</div></div>';
  $('#btnManual').addEventListener('click', () => {
    const fin = $('#mFinDescanso').value, horas = parseFloat($('#mHoras').value), pausa = parseFloat($('#mPausa').value);
    let ok = true;
    const marcar = (id, cond, msg) => { const i = $('#' + id); $('#' + id + 'Err').innerHTML = cond ? '' : errorLinea(id + 'ErrTxt', msg); if (cond) i.removeAttribute('aria-invalid'); else { i.setAttribute('aria-invalid', 'true'); if (ok) i.focus(); ok = false; } };
    marcar('mFinDescanso', !!fin && new Date(fin) <= new Date(), fin ? 'La hora del descanso no puede ser futura.' : 'Indique la fecha y hora en que terminó su descanso.');
    marcar('mHoras', !isNaN(horas) && horas >= 0, 'Escriba las horas manejadas, por ejemplo 6.5.');
    marcar('mPausa', !isNaN(pausa) && pausa >= 0, 'Escriba hace cuántas horas apagó la unidad; 0 si acaba de parar.');
    if (!ok) return;
    const finD = new Date(fin), ahora = new Date();
    const inicioDesc = new Date(finD.getTime() - REGLAS.descansoEfectivo * 3600e3);
    const finCond = new Date(ahora.getTime() - pausa * 3600e3);
    const inicioCond = new Date(finCond.getTime() - horas * 3600e3);
    const segmentos = [{ inicio: new Date(inicioDesc.getTime() - 3600e3), fin: inicioDesc }];
    if (horas > 0 && inicioCond >= finD) segmentos.push({ inicio: inicioCond, fin: finCond });
    else if (horas > 0) segmentos.push({ inicio: finD, fin: finCond });
    const a = analizarActividad(segmentos, ahora);
    estado.gps = { unidad: estado.datos.economico, ubicacion: 'Sin señal GPS', segmentos, analisis: a, origen: 'manual', consultadoEn: ahora };
    render();
  });
}

function anillo(etiqueta, valorTxt, frac, clase, sub, ico) {
  const r = 24, c = 2 * Math.PI * r, f = Math.max(0, Math.min(1, isFinite(frac) ? frac : 0));
  return '<div class="hos-item"><div class="anillo ' + clase + '"><svg viewBox="0 0 56 56" aria-hidden="true"><circle class="pista" cx="28" cy="28" r="' + r + '"/><circle class="valor" cx="28" cy="28" r="' + r + '" stroke-dasharray="' + (c * f).toFixed(1) + ' ' + c.toFixed(1) + '"/></svg><div class="anillo-ico">' + ico + '</div></div>' +
    '<div class="hos-v">' + valorTxt + '</div><div class="hos-k">' + etiqueta + '</div><div class="hos-sub">' + sub + '</div></div>';
}

function pintarVeredictoGps() {
  const g = estado.gps; if (!g) return;
  clearInterval(temporizador);
  const ahora = new Date();
  const a = analizarActividad(g.segmentos, ahora, g.desde);
  g.analisis = a;
  const ultimoFin = g.segmentos.length ? Math.max(...g.segmentos.map(x => x.fin.getTime())) : null;
  const enMovimiento = isFinite(a.pausaActual) && a.pausaActual < 5 / 60;
  const claseManejo = a.horasJornada >= REGLAS.maxConduccion ? 'danger' : a.restante <= REGLAS.avisoRestante ? 'warn' : '';
  const clasePausa = a.pausaActual >= REGLAS.descansoEfectivo ? 'ok' : a.pausaActual >= REGLAS.pausaReinicio ? 'warn' : '';
  let ventanaH = null, claseVentana = 'danger', ventanaTxt = '—', ventanaSub = 'sin descanso 8 h';
  if (a.ultimoDescanso) {
    ventanaH = a.ultimoDescanso.enCurso ? 0 : (ahora - a.ultimoDescanso.fin) / 3600e3;
    claseVentana = ventanaH <= REGLAS.ventanaDescanso ? 'ok' : 'danger';
    ventanaTxt = fmtHM(ventanaH); ventanaSub = 'tras desc. de ' + fmtHM(a.ultimoDescanso.horas);
  }

  let html = '<div class="pila">';
  if (g.origen === 'manual') html += '<div class="aviso warn">' + ICONO.alerta + '<div><b>Horas declaradas por el operador</b>No se verificaron con GPS. Cabina de Seguridad debe validar antes de autorizar la salida.</div></div>';

  html += '<div class="tarjeta"><div class="hos-cab"><div class="ojal">Horas de servicio · ' + esc(g.unidad) + '</div><span class="hos-vivo"><i aria-hidden="true"></i>En vivo</span></div>' +
    '<div class="hos">' +
      '<div class="hos-item"><div class="estado-tile ' + (enMovimiento ? 'on' : '') + '">' + (enMovimiento ? 'ON' : 'OFF') + '</div><div class="hos-v cron" id="hosTimer">' + fmtHMS(ultimoFin ? (ahora - ultimoFin) / 1000 : 0) + '</div><div class="hos-k">' + (enMovimiento ? 'Manejando' : 'Detenido') + '</div><div class="hos-sub">' + (enMovimiento ? 'motor en marcha' : 'desde última parada') + '</div></div>' +
      anillo('Pausa', fmtHM(a.pausaActual), a.pausaActual / REGLAS.descansoEfectivo, clasePausa, 'meta ' + fmtHM(REGLAS.descansoEfectivo), ICONO.reloj) +
      anillo('Manejo', fmtHM(a.horasJornada), a.horasJornada / REGLAS.maxConduccion, claseManejo, 'máx ' + fmtHM(REGLAS.maxConduccion), ICONO.camion) +
      anillo('Ventana', ventanaTxt, ventanaH === null ? 1 : ventanaH / REGLAS.ventanaDescanso, claseVentana, ventanaSub, ICONO.gps) +
      anillo('Restante', fmtHM(a.restante), a.restante / REGLAS.maxConduccion, a.restante <= REGLAS.avisoRestante ? 'warn' : 'ok', 'para manejar', ICONO.check) +
    '</div>' +
    '<div class="hos-leyenda"><span class="l-az"><i></i>En curso</span><span class="l-ok"><i></i>En regla</span><span class="l-warn"><i></i>Atención</span><span class="l-danger"><i></i>Fuera de norma</span></div>' +
    '</div>';

  if (a.estado === 'bloqueado') {
    const fin = new Date(Date.now() + a.esperaHoras * 3600e3);
    html += '<div class="estado-card bloqueo" role="alert"><div class="franja-alto" aria-hidden="true"></div><div class="estado-cuerpo">' +
      '<div><div class="ojal" style="color:var(--danger-text)">Por el momento no puede realizar la prueba</div>' +
      '<h2>' + ICONO.xOctagono + 'Descanso obligatorio</h2></div><p>' + esc(a.motivo) + '</p>' +
      '<div class="cuenta"><div class="k">Podrá continuar la evaluación en</div><div class="reloj" id="reloj">' + esc(fmtH(a.esperaHoras)) + '</div><div class="h">a partir de las <b>' + fmtHora(fin) + '</b>' + (fin.getDate() !== new Date().getDate() ? ' de mañana' : '') + '</div></div>' +
      '<p class="texto-2">Apague la unidad, busque un parador seguro y descanse. Cabina de Seguridad ya tiene este registro. Si cree que es un error, repórtelo por radio o WhatsApp.</p>' +
      '<button class="btn fantasma" id="btnReconsultar" type="button">' + ICONO.reloj + ' Volver a consultar</button>' +
      '</div></div>';
  } else {
    html += '<div class="estado-card permiso"><div class="franja-ok" aria-hidden="true"></div><div class="estado-cuerpo">' +
      '<div><div class="ojal" style="color:var(--ok-text)">Horas en regla</div><h2>' + ICONO.checkCirculo + 'Puede continuar</h2></div>' +
      (a.advertencia ? '<div class="aviso warn">' + ICONO.alerta + '<div>' + esc(a.advertencia) + '</div></div>' : '') +
      '<p class="texto-2">Descanso efectivo vigente y ' + esc(fmtH(a.restante)) + ' disponibles de conducción. La encuesta toma 3 minutos.</p>' +
      '<button class="btn primario" id="btnIniciar" type="button">Continuar evaluación ' + ICONO.check + '</button>' +
      '</div></div>';
  }
  html += '</div>';
  $('#veredictoGps').innerHTML = html;

  let ticks = 0;
  temporizador = setInterval(() => {
    ticks++;
    const t = $('#hosTimer'); if (t && ultimoFin) t.textContent = fmtHMS((Date.now() - ultimoFin) / 1000);
    if (ticks % 30 === 0) { pintarVeredictoGps(); }
  }, 1000);

  if (a.estado === 'bloqueado') {
    if (!g.vibrado) { vibrar([40, 60, 40]); g.vibrado = true; }
    $('#btnReconsultar').addEventListener('click', pintarVeredictoGps);
  } else {
    $('#btnIniciar').addEventListener('click', () => { estado.datos.fecha = new Date().toISOString(); estado.paso = 0; estado.mostrarErrores = false; render(); });
  }
}

/* ---------- Secciones ---------- */
function renderSeccion() {
  const s = SECCIONES[estado.paso];
  const poste = '<span class="poste" aria-hidden="true"><b>KM</b><i>' + (estado.paso + 1) + '</i></span>';
  let html = '<section class="etapa pila-24"><div class="seccion-cab">' + senalSVG(s.senal, s.icono) +
    '<div class="seccion-txt"><div class="ojal">' + poste + 'Tramo ' + (estado.paso + 1) + ' de ' + SECCIONES.length + (s.preguntas ? ' · ' + s.preguntas.length + ' preguntas' : '') + '</div><h1 class="titulo">' + esc(s.titulo) + '</h1></div></div>' +
    '<p class="subtitulo">' + esc(s.sub) + '</p>' +
    '<div id="resumenErrores"></div>';
  if (s.id === 'compromiso') html += renderCompromiso();
  else if (s.id === 'identificacion') html += renderIdentificacion();
  else if (s.id === 'datos') html += renderDatos();
  else if (s.id === 'confirmacion') html += renderConfirmacion();
  else html += '<div class="tarjeta">' + s.preguntas.map(renderPregunta).join('') + '</div>';
  html += '</section>';
  vista.innerHTML = html;
  if (s.id === 'compromiso') enlazarCompromiso();
  else if (s.id === 'identificacion') enlazarIdentificacion();
  else if (s.id === 'datos') enlazarDatos();
  else if (s.id === 'confirmacion') enlazarConfirmacion();
  else enlazarPreguntas(s);
  actualizarPie();
  if (estado.mostrarErrores) mostrarErrores(false);
}

    '<p>Me comprometo a conducir conforme a los <b>hábitos de conducción, límites de velocidad, paradas autorizadas y descansos efectivos</b> establecidos en la NOM-087-SCT-2-2017 y en la política de descanso de ILG; a <b>no detenerme sobre la carretera ni en el acotamiento</b>, y a permanecer únicamente en paradores y pensiones autorizados.</p>' +

    '</div></div>';

function enlazarCompromiso() {

function renderIdentificacion() {
  const u = estado.ubicacion;
  return '<div class="fila-2">' +
    '<div class="tarjeta pila" id="fotoBox"><div class="tarjeta-titulo"><span class="ico">' + ICONO.camara + '</span><div>Foto del operador<div class="ayuda">Para identificación visual. Mire a la cámara.</div></div></div>' +
      '<div class="foto-marco" id="fotoMarco">' + (estado.foto ? '<img src="' + estado.foto + '" alt="Foto del operador">' : '<div class="foto-vacia">' + ICONO.usuario + '<span>Sin foto</span></div>') + '</div>' +

    '<div class="tarjeta pila" id="ubiBox"><div class="tarjeta-titulo"><span class="ico">' + ICONO.pin + '</span><div>Ubicación<div class="ayuda">Registra el lugar donde se aplica la evaluación.</div></div></div>' +
      '<div class="foto-marco ubi" id="ubiMarco">' + (u ? '<div class="ubi-dato"><b>' + u.lat.toFixed(5) + ', ' + u.lon.toFixed(5) + '</b><span>± ' + Math.round(u.precision) + ' m · ' + fmtHora(u.hora) + '</span><a href="https://www.google.com/maps?q=' + u.lat + ',' + u.lon + '" target="_blank" rel="noopener">Ver en el mapa</a></div>' : '<div class="foto-vacia">' + ICONO.pin + '<span>' + (estado.gps ? esc(estado.gps.ubicacion) : 'Sin ubicación') + '</span></div>') + '</div>' +
      '<button class="btn secundario" id="btnUbi" type="button">' + ICONO.pin + ' ' + (u ? 'Actualizar ubicación' : 'Compartir ubicación') + '</button>' +
      '<div class="estado-permiso" id="ubiEstado">' + (u ? ICONO.checkCirculo + ' Ubicación registrada' : estado.ubicacionEstado === 'denegada' ? ICONO.alerta + ' Sin permiso. Se usará la posición del GPS de la unidad.' : 'Recomendada. Si no hay permiso, se usa el GPS de la unidad.') + '</div></div>' +
    '</div>';
}
function enlazarIdentificacion() {
  const inp = $('#fotoInput');
  $('#btnFoto').addEventListener('click', () => inp.click());
  inp.addEventListener('change', () => {
    const f = inp.files && inp.files[0]; if (!f) return;
    const img = new Image(); const url = URL.createObjectURL(f);
    img.onload = () => {
      const lado = 480, esc_ = Math.min(1, lado / Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = Math.round(img.width * esc_); c.height = Math.round(img.height * esc_);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      estado.foto = c.toDataURL('image/jpeg', 0.72); URL.revokeObjectURL(url);
      $('#fotoMarco').innerHTML = '<img src="' + estado.foto + '" alt="Foto del operador">';
      $('#btnFoto').innerHTML = ICONO.camara + ' Repetir foto';
      $('#fotoEstado').innerHTML = ICONO.checkCirculo + ' Foto capturada'; $('#fotoBox').classList.remove('error'); $('#fotoErr').innerHTML = '';
      actualizarPie(); if (estado.mostrarErrores) mostrarErrores(false);
    };
    img.onerror = () => { toast('No se pudo leer la imagen. Intente de nuevo.'); URL.revokeObjectURL(url); };
    img.src = url;
  });
  $('#btnUbi').addEventListener('click', () => {
    const est = $('#ubiEstado');
    if (!navigator.geolocation) { estado.ubicacionEstado = 'denegada'; est.innerHTML = ICONO.alerta + ' Este dispositivo no ofrece ubicación.'; return; }
    est.innerHTML = '<span class="spinner" aria-hidden="true" style="width:14px;height:14px;border-width:2px"></span> Obteniendo ubicación…';
    navigator.geolocation.getCurrentPosition(p => {
      estado.ubicacion = { lat: p.coords.latitude, lon: p.coords.longitude, precision: p.coords.accuracy || 0, hora: new Date().toISOString() };
      estado.posicion = { lat: estado.ubicacion.lat, lon: estado.ubicacion.lon }; estado.ubicacionEstado = 'ok';
      renderSeccion();
    }, () => { estado.ubicacionEstado = 'denegada'; est.innerHTML = ICONO.alerta + ' Sin permiso o sin señal. Se usará la posición del GPS de la unidad.'; }, { enableHighAccuracy: true, timeout: 10000, maximumAge: 30000 });
  });
}

function renderDatos() {
  const d = estado.datos, g = estado.gps;
  return '<div class="tarjeta pila">' +
    '<div class="campo"><label for="fNombre">Nombre completo del operador <span class="req" aria-hidden="true">*</span></label><input id="fNombre" autocomplete="name" placeholder="Nombre y apellidos" value="' + esc(d.nombre) + '" aria-describedby="fNombreAyuda"><div class="ayuda" id="fNombreAyuda">Capturado al iniciar. Corríjalo si hace falta.</div><div id="fNombreErr"></div></div>' +
    '<div class="fila-2">' +

const VALIDA_DATOS = {

function validarCampo(id, mostrar) {

}
function enlazarDatos() {

    inp.addEventListener('blur', () => validarCampo(id, true));

}

function enlazarPreguntas(s) {

function renderConfirmacion() {
  const d = estado.datos, g = estado.gps;
  const contestadas = SECCIONES.filter(s => s.preguntas).reduce((n, s) => n + s.preguntas.filter(q => estado.respuestas[q.id] !== undefined).length, 0);
  return '<div class="pila">' +
    '<div class="tarjeta"><div class="ojal">Resumen</div><div class="resumen">' +
      '<div><div class="k">Operador</div><div class="v">' + esc(d.nombre) + '</div></div>' +
      '<div><div class="k">Unidad</div><div class="v">' + esc(d.economico) + '</div></div>' +
      '<div><div class="k">Ruta</div><div class="v">' + esc(d.ruta) + '</div></div>' +
      '<div><div class="k">Fecha</div><div class="v">' + esc(fmtFechaHora(d.fecha)) + '</div></div>' +
      '<div><div class="k">Conducción jornada</div><div class="v">' + esc(fmtH(g.analisis.horasJornada)) + '</div></div>' +
      '<div><div class="k">Respuestas</div><div class="v">' + contestadas + ' de ' + TOTAL_PREGUNTAS + '</div></div>' +
      '<div><div class="k">Ubicación</div><div class="v">' + (estado.ubicacion ? estado.ubicacion.lat.toFixed(4) + ', ' + estado.ubicacion.lon.toFixed(4) : 'GPS de la unidad') + '</div></div>' +
      '<div><div class="k">Foto</div><div class="v">' + (estado.foto ? '<img class="foto-mini" src="' + estado.foto + '" alt="Foto del operador">' : '—') + '</div></div>' +
    '</div></div>' +
    '<div><label class="casilla" id="casillaAcepta"><input type="checkbox" id="chkAcepta"' + (estado.acepta ? ' checked' : '') + '><span>Declaro que mis respuestas son verdaderas, que revisé físicamente la unidad y que me comprometo a reportar a Cabina de Seguridad cualquier cambio en mi estado o en la unidad durante la ruta.</span></label><div id="chkAceptaErr"></div></div>' +
    '<div class="pila" style="gap:8px"><div class="ojal" id="firmaTitulo">Firma del operador</div>' +
      '<div class="firma" id="firmaBox"><canvas id="firmaCanvas" role="img" aria-labelledby="firmaTitulo"></canvas><div class="pista" id="firmaPista"' + (estado.firma ? ' hidden' : '') + '>Firme aquí con el dedo</div><button type="button" class="btn fantasma btn-chico limpiar" id="firmaLimpiar">Borrar</button></div>' +
      '<div class="campo"><label for="firmaTexto">O escriba su nombre completo como firma</label><input id="firmaTexto" autocomplete="off" placeholder="Nombre y apellidos" value="' + esc(estado.firmaTexto) + '" aria-describedby="firmaAyuda"><div class="ayuda" id="firmaAyuda">Alternativa si no puede firmar con el dedo.</div></div>' +
      '<div id="firmaErr"></div></div>' +
    '</div>';
}
function enlazarConfirmacion() {
  $('#chkAcepta').addEventListener('change', e => { estado.acepta = e.target.checked; $('#casillaAcepta').classList.remove('error'); $('#chkAceptaErr').innerHTML = ''; actualizarPie(); if (estado.mostrarErrores) mostrarErrores(false); });
  const c = $('#firmaCanvas'), ctx = c.getContext('2d');
  const r = c.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
  c.width = r.width * dpr; c.height = r.height * dpr; ctx.scale(dpr, dpr);
  ctx.lineWidth = 2.5; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue('--fg').trim();
  let dibujando = false, trazoPx = 0;
  const pos = e => { const b = c.getBoundingClientRect(); return [e.clientX - b.left, e.clientY - b.top]; };
  const firmaOk = () => { $('#firmaBox').classList.remove('error'); $('#firmaErr').innerHTML = ''; actualizarPie(); if (estado.mostrarErrores) mostrarErrores(false); };
  c.addEventListener('pointerdown', e => { dibujando = true; c.setPointerCapture(e.pointerId); const [x, y] = pos(e); ctx.beginPath(); ctx.moveTo(x, y); });
  c.addEventListener('pointermove', e => {
    if (!dibujando) return; const [x, y] = pos(e); ctx.lineTo(x, y); ctx.stroke(); trazoPx += Math.abs(e.movementX || 1) + Math.abs(e.movementY || 0);
    if (!estado.firma && trazoPx > 40) { estado.firma = true; $('#firmaPista').hidden = true; firmaOk(); }
  });
  const fin = () => { dibujando = false; };
  c.addEventListener('pointerup', fin); c.addEventListener('pointercancel', fin);
  $('#firmaLimpiar').addEventListener('click', () => { ctx.clearRect(0, 0, c.width, c.height); estado.firma = false; trazoPx = 0; $('#firmaPista').hidden = false; actualizarPie(); });
  $('#firmaTexto').addEventListener('input', e => { estado.firmaTexto = e.target.value; if (estado.firmaTexto.trim().length >= 5) firmaOk(); else actualizarPie(); });
}

/* ---------- Validación, errores y navegación ---------- */
function faltantes() {
  const s = SECCIONES[estado.paso], f = [];
  if (s.id === 'compromiso') {
    if (!estado.compromiso) f.push({ id: 'chkCompromiso', texto: 'Marque que leyó y acepta el compromiso.', tipo: 'compromiso' });
  } else if (s.id === 'identificacion') {
    if (!estado.foto) f.push({ id: 'btnFoto', texto: 'Tome la foto del operador.', tipo: 'foto' });
  } else if (s.id === 'datos') {
    for (const id of Object.keys(VALIDA_DATOS)) if (!VALIDA_DATOS[id].ok(estado.datos[VALIDA_DATOS[id].campo])) f.push({ id, texto: VALIDA_DATOS[id].msg, tipo: 'campo' });
  } else if (s.id === 'confirmacion') {
    if (!estado.acepta) f.push({ id: 'chkAcepta', texto: 'Marque la declaración de veracidad.', tipo: 'casilla' });
    if (!estado.firma && estado.firmaTexto.trim().length < 5) f.push({ id: 'firmaTexto', texto: 'Firme con el dedo o escriba su nombre completo como firma.', tipo: 'firma' });
  } else {
    for (const q of s.preguntas) if (estado.respuestas[q.id] === undefined) f.push({ id: 'p-' + q.id, texto: q.texto, tipo: 'pregunta' });
  }
  return f;
}
function mostrarErrores(enfocar) {
  const f = faltantes(), caja = $('#resumenErrores');
  estado.mostrarErrores = f.length > 0;
  if (!f.length) { caja.innerHTML = ''; return; }
  caja.innerHTML = '<div class="resumen-errores" role="alert" tabindex="-1" id="resumenErroresBox" aria-labelledby="resumenErroresTitulo">' +
    '<h2 id="resumenErroresTitulo">' + ICONO.alerta + 'Falta' + (f.length === 1 ? '' : 'n') + ' ' + f.length + ' ' + (f.length === 1 ? 'respuesta' : 'respuestas') + '</h2>' +
    '<ul>' + f.map(x => '<li><a href="#' + x.id + '" data-ir="' + x.id + '">' + esc(x.texto) + '</a></li>').join('') + '</ul></div>';
  for (const x of f) {
    if (x.tipo === 'pregunta') { $('#' + x.id).classList.add('error'); $('#' + x.id + '-err').innerHTML = errorLinea(x.id + '-errtxt', 'Elija una respuesta.'); }
    else if (x.tipo === 'campo') validarCampo(x.id, true);
    else if (x.tipo === 'casilla') { $('#casillaAcepta').classList.add('error'); $('#chkAceptaErr').innerHTML = errorLinea('chkAceptaErrTxt', x.texto); }
    else if (x.tipo === 'firma') { $('#firmaBox').classList.add('error'); $('#firmaErr').innerHTML = errorLinea('firmaErrTxt', x.texto); }
    else if (x.tipo === 'compromiso') { $('#casillaCompromiso').classList.add('error'); $('#chkCompromisoErr').innerHTML = errorLinea('chkCompromisoErrTxt', x.texto); }
    else if (x.tipo === 'foto') { $('#fotoBox').classList.add('error'); $('#fotoErr').innerHTML = errorLinea('fotoErrTxt', x.texto); }
  }
  caja.querySelectorAll('a[data-ir]').forEach(a => a.addEventListener('click', e => {
    e.preventDefault(); const el = $('#' + a.dataset.ir);
    el.scrollIntoView({ behavior: 'smooth', block: 'center' });
    const foco = el.matches('input') ? el : el.querySelector('button, input') || el; foco.focus({ preventScroll: true });
  }));
  if (enfocar) { $('#resumenErroresBox').scrollIntoView({ behavior: 'smooth', block: 'start' }); $('#resumenErroresBox').focus({ preventScroll: true }); }
}
function actualizarPie() {
  const n = faltantes().length, ultimo = estado.paso === SECCIONES.length - 1;
  const btn = $('#btnSiguiente');
  btn.innerHTML = ultimo ? 'Enviar y ver dictamen ' + ICONO.check : 'Continuar';
  btn.classList.toggle('ok', ultimo); btn.classList.toggle('primario', !ultimo);
  $('#btnAtras').textContent = estado.paso === 0 ? 'Horas' : 'Atrás';
  const pe = $('#pieEstado');
  pe.classList.toggle('ok', n === 0);
  pe.innerHTML = n > 0 ? 'Falta' + (n === 1 ? '' : 'n') + ' ' + n + ' ' + (SECCIONES[estado.paso].preguntas ? 'respuesta' : 'paso') + (n === 1 ? '' : 's')
                       : ICONO.checkCirculo + ' Todo listo';
}
$('#btnSiguiente').addEventListener('click', async () => {
  if (faltantes().length) { mostrarErrores(true); return; }
  estado.mostrarErrores = false;
  if (estado.paso === SECCIONES.length - 1) {
    const btn = $('#btnSiguiente'); btn.setAttribute('aria-busy', 'true'); btn.disabled = true;
    btn.innerHTML = '<span class="spinner" aria-hidden="true"></span> Calculando dictamen…';
    await esperar(700);
    calcularResultado(); estado.paso = SECCIONES.length;
    btn.removeAttribute('aria-busy'); btn.disabled = false;
    vibrar(estado.resultado.apto ? 30 : [40, 60, 40]);
  } else estado.paso++;
  render();
});
$('#btnAtras').addEventListener('click', () => { estado.paso--; estado.mostrarErrores = false; render(); });

/* ---------- Dictamen ---------- */
function calcularResultado() {
  const factores = []; let puntos = 0, criticos = 0;
  for (const s of SECCIONES) {
    if (!s.preguntas) continue;
    for (const q of s.preguntas) {
      const r = q.riesgo(estado.respuestas[q.id]);
      if (!r) continue;
      if (r.critico) { criticos++; factores.push({ sev: 'critico', t: r.t, seccion: s.nombre }); }
      else { puntos += r.p; factores.push({ sev: 'riesgo', t: r.t + ' (+' + r.p + ')', seccion: s.nombre }); }
    }
  }
  const g = estado.gps.analisis;
  if (g.advertencia) factores.push({ sev: 'riesgo', t: 'GPS: ' + g.advertencia, seccion: 'GPS' });
  if (estado.gps.origen === 'manual') factores.push({ sev: 'riesgo', t: 'Horas de conducción sin verificar por GPS. Requiere validación de Cabina.', seccion: 'GPS' });
  const apto = criticos === 0 && puntos < REGLAS.puntosNoApto;
  const f = new Date(estado.datos.fecha);
  const folio = 'PV-' + f.getFullYear() + String(f.getMonth() + 1).padStart(2, '0') + String(f.getDate()).padStart(2, '0') + '-' + String(f.getHours()).padStart(2, '0') + String(f.getMinutes()).padStart(2, '0') + '-' + estado.datos.economico.replace(/[^A-Z0-9]/g, '');
  estado.resultado = { apto, factores, puntos, criticos, folio, pendienteValidacion: estado.gps.origen === 'manual' };
  try {
    const h = JSON.parse(localStorage.getItem('previaje.historial') || '[]');
    h.unshift({ folio, fecha: estado.datos.fecha, nombre: estado.datos.nombre, economico: estado.datos.economico, ruta: estado.datos.ruta, apto, puntos, criticos });
    localStorage.setItem('previaje.historial', JSON.stringify(h.slice(0, 20)));
  } catch (e) {}
}

function textoResumen() {
  const r = estado.resultado, d = estado.datos, g = estado.gps.analisis;
  return 'PRE-VIAJE · ' + (r.apto ? 'APTO' : 'NO APTO') + (r.pendienteValidacion ? ' (pendiente validación GPS)' : '') + '\n' +
    'Folio: ' + r.folio + '\nOperador: ' + d.nombre + '\nUnidad: ' + d.economico + '\nRuta: ' + d.ruta + '\nFecha: ' + fmtFechaHora(d.fecha) + '\n' +
    'Conducción jornada: ' + fmtH(g.horasJornada) + ' · Disponible: ' + fmtH(g.restante) + '\n' +
    'Ubicación: ' + (estado.ubicacion ? estado.ubicacion.lat.toFixed(5) + ', ' + estado.ubicacion.lon.toFixed(5) + ' (teléfono)' : estado.gps.ubicacion + ' (GPS unidad)') + '\nCompromiso aceptado: sí · Foto: ' + (estado.foto ? 'sí' : 'no') + '\n' +
    (r.factores.length ? 'Factores:\n' + r.factores.map(x => '- [' + (x.sev === 'critico' ? 'CRÍTICO' : 'RIESGO') + '] ' + x.t).join('\n') : 'Sin factores de riesgo.');
}

function renderResultado() {
  const r = estado.resultado, d = estado.datos;
  let html = '<section class="etapa pila-24">';
  html += '<div class="letrero ' + (r.apto ? 'apto' : 'noapto') + '" role="status"><div class="ojal">Dictamen pre-viaje</div><span class="senal">' + (r.apto ? 'Siga' : 'Alto') + '</span><h2>' + (r.apto ? ICONO.checkCirculo + 'Apto' : ICONO.xOctagono + 'No apto') + '</h2>' +
    '<p>' + (r.apto ? 'Puede iniciar el viaje. Buen camino, ' + esc(d.nombre.split(' ')[0]) + '.' : 'No salga. Repórtese con Cabina de Seguridad.') + '</p>' +
    '<div class="folio">Folio ' + esc(r.folio) + '</div></div>';
  if (r.pendienteValidacion) html += '<div class="aviso warn">' + ICONO.alerta + '<div><b>Pendiente de validación</b>Las horas de conducción se declararon sin GPS. Cabina debe validar antes de autorizar la salida.</div></div>';
  html += '<div class="tarjeta identidad">' + (estado.foto ? '<img class="foto-mini grande" src="' + estado.foto + '" alt="Foto del operador">' : '<div class="foto-mini grande vacia">' + ICONO.usuario + '</div>') + '<div class="identidad-txt"><b>' + esc(d.nombre) + '</b><span>Unidad ' + esc(d.economico) + ' · ' + esc(d.ruta) + '</span><span>' + esc(fmtFechaHora(d.fecha)) + '</span><span>' + (estado.ubicacion ? ICONO.pin + ' ' + estado.ubicacion.lat.toFixed(5) + ', ' + estado.ubicacion.lon.toFixed(5) : ICONO.gps + ' ' + esc(estado.gps.ubicacion)) + '</span><span>' + ICONO.checkCirculo + ' Compromiso aceptado</span></div></div>';

  html += '<div class="tarjeta"><div class="ojal">' + (r.factores.length ? 'Factores detectados' : 'Sin factores de riesgo') + '</div>';
  if (r.factores.length) {
    html += '<ul class="factores">' + r.factores.map(x => '<li><span class="sev ' + x.sev + '">' + (x.sev === 'critico' ? ICONO.xOctagono + 'Crítico' : ICONO.alerta + 'Riesgo') + '</span><span>' + esc(x.t) + '</span></li>').join('') + '</ul>' +
      '<p class="texto-2" style="margin-top:12px">Un factor crítico vuelve NO APTO por sí solo. Los puntos de riesgo suman ' + r.puntos + ' de ' + REGLAS.puntosNoApto + ' necesarios para NO APTO.</p>';
  } else html += '<p class="texto-2" style="margin-top:4px">Descanso en regla, sin malestares, unidad revisada y documentos completos.</p>';
  html += '</div>';

  if (!r.apto) html += '<div class="aviso info">' + ICONO.info + '<div><b>¿Qué sigue?</b>Cabina de Seguridad recibe este dictamen. Si el motivo es descanso o salud, se reprograma la salida. Si es la unidad, se levanta reporte a Mantenimiento. Esto no es una sanción: es la decisión correcta.</div></div>';

  html += '<div class="acciones">' +
    '<a class="btn ok" id="btnWa" href="https://wa.me/?text=' + encodeURIComponent(textoResumen()) + '" target="_blank" rel="noopener">' + ICONO.wa + ' Enviar a Cabina por WhatsApp</a>' +
    '<button class="btn fantasma" id="btnCopiar" type="button">' + ICONO.copiar + ' <span id="btnCopiarTxt">Copiar resumen</span></button>' +
    '<button class="btn secundario" id="btnNueva" type="button">Nueva evaluación</button></div>';
  html += renderHistorialCorto();
  html += '</section>';
  vista.innerHTML = html;

  $('#btnCopiar').addEventListener('click', async () => {
    try { await navigator.clipboard.writeText(textoResumen()); $('#btnCopiarTxt').textContent = 'Resumen copiado'; toast('Resumen copiado.'); setTimeout(() => { const t = $('#btnCopiarTxt'); if (t) t.textContent = 'Copiar resumen'; }, 2500); }
    catch (e) { toast('No se pudo copiar automáticamente. Use el botón de WhatsApp.'); }
  });
  $('#btnNueva').addEventListener('click', () => {
    Object.assign(estado, { paso: -1, gps: null, respuestas: {}, firma: false, firmaTexto: '', acepta: false, compromiso: false, foto: null, ubicacion: null, ubicacionEstado: 'pendiente', mostrarErrores: false, resultado: null, datos: { nombre: estado.datos.nombre, economico: estado.datos.economico, fecha: '', ruta: '' } });
    render();
  });
}

function renderHistorialCorto() {
  let h = [];
  try { h = JSON.parse(localStorage.getItem('previaje.historial') || '[]'); } catch (e) {}
  if (!h.length) return '';
  return '<div class="tarjeta historial"><div class="ojal">Últimas evaluaciones en este teléfono</div><ul>' +
    h.slice(0, 5).map(x => '<li><span>' + esc(fmtFechaHora(x.fecha)) + ' · ' + esc(x.economico) + ' · ' + esc(x.nombre.split(' ')[0]) + '</span><span class="etiqueta ' + (x.apto ? 'apto' : 'noapto') + '">' + (x.apto ? ICONO.check + 'Apto' : ICONO.x + 'No apto') + '</span></li>').join('') + '</ul></div>';
}

function toast(msg) {
  const t = document.createElement('div'); t.className = 'aviso-toast'; t.textContent = msg; t.setAttribute('role', 'status'); t.setAttribute('aria-live', 'polite');
  document.body.appendChild(t); setTimeout(() => t.remove(), 3000);
