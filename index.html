<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pre-Viaje">
<meta name="theme-color" content="#15212b">
<title>Pre-Viaje Operador</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   PLAN DE DISEÑO
   Concepto: "tablero de cabina + señalización carretera".
   Una sola columna, botones grandes (≥56 px) para dedo con guante,
   lectura rápida a pleno sol y en cabina de noche (modo noche).
   Color: asfalto, concreto, ámbar reflejante (acento), verde carretera
   (apto), rojo alto (no apto). La franja de chevrones ámbar/negro
   (como la defensa trasera de un remolque) marca las barreras.
   Tipografía: Barlow Condensed (rótulos, como letrero vial) + Barlow.
   ============================================================ */
:root {
  --bg: #ecefe9;            /* concreto claro con sesgo verde */
  --bg-2: #e1e5dd;
  --panel: #ffffff;
  --panel-2: #f6f7f3;
  --ink: #15212b;           /* asfalto */
  --ink-2: #4b5a67;
  --ink-3: #7d8a95;
  --linea: #cfd5cc;
  --linea-2: #aeb7ac;
  --ambar: #f2a900;         /* reflejante */
  --ambar-ink: #8a5a00;     /* texto ámbar legible sobre claro */
  --ambar-suave: #fff1cc;
  --verde: #0d7a48;         /* letrero carretero */
  --verde-ink: #0a5e38;
  --verde-suave: #d8efe2;
  --rojo: #c8242b;          /* ALTO */
  --rojo-ink: #9c1b21;
  --rojo-suave: #fadadb;
  --azul: #1e4f8f;          /* servicios / GPS */
  --azul-suave: #dce7f6;
  --sombra: 0 1px 2px rgba(21,33,43,.06), 0 6px 18px rgba(21,33,43,.08);
  --radio: 14px;
  --f-display: 'Barlow Condensed', 'Arial Narrow', Impact, sans-serif;
  --f-body: 'Barlow', 'Segoe UI', Roboto, Arial, sans-serif;
  --toque: 56px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11161a; --bg-2: #0b0f12; --panel: #1a2128; --panel-2: #212a32;
    --ink: #eef1ec; --ink-2: #b3bcc4; --ink-3: #7f8b96;
    --linea: #2e3842; --linea-2: #45515c;
    --ambar: #f5b325; --ambar-ink: #f5c457; --ambar-suave: #3a2d0b;
    --verde: #19a45f; --verde-ink: #5fd79a; --verde-suave: #10311f;
    --rojo: #e0393f; --rojo-ink: #ff7a7f; --rojo-suave: #3d1517;
    --azul: #5b93dc; --azul-suave: #172a44;
    --sombra: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.45);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #11161a; --bg-2: #0b0f12; --panel: #1a2128; --panel-2: #212a32;
  --ink: #eef1ec; --ink-2: #b3bcc4; --ink-3: #7f8b96;
  --linea: #2e3842; --linea-2: #45515c;
  --ambar: #f5b325; --ambar-ink: #f5c457; --ambar-suave: #3a2d0b;
  --verde: #19a45f; --verde-ink: #5fd79a; --verde-suave: #10311f;
  --rojo: #e0393f; --rojo-ink: #ff7a7f; --rojo-suave: #3d1517;
  --azul: #5b93dc; --azul-suave: #172a44;
  --sombra: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.45);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { height: 100%; }
body {
  margin: 0; min-height: 100%;
  background: var(--bg); color: var(--ink);
  font-family: var(--f-body); font-size: 17px; line-height: 1.45;
  -webkit-font-smoothing: antialiased;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--ambar); outline-offset: 2px; }
[hidden] { display: none !important; }
h1, h2, h3 { margin: 0; font-family: var(--f-display); text-wrap: balance; line-height: 1.05; }
p { margin: 0; }

/* ---------- Cabecera ---------- */
.cabecera {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10;
  background: var(--ink); color: #fff;
  border-bottom: 1px solid rgba(255,255,255,.08);
}
.cabecera-int {
  max-width: 560px; margin: 0 auto; padding: 10px 16px;
  display: flex; align-items: center; gap: 12px;
}
.marca { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1; }
.marca-icono {
  width: 40px; height: 40px; border-radius: 10px; background: var(--ambar);
  display: grid; place-items: center; flex-shrink: 0;
}
.marca-icono svg { width: 26px; height: 26px; }
.marca-texto { line-height: 1.05; min-width: 0; }
.marca-texto .t { font-family: var(--f-display); font-weight: 800; font-size: 22px; letter-spacing: .02em; text-transform: uppercase; }
.marca-texto .s { font-size: 12px; color: rgba(255,255,255,.65); letter-spacing: .06em; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.btn-tema {
  width: 44px; height: 44px; border-radius: 10px; border: 1px solid rgba(255,255,255,.18);
  background: rgba(255,255,255,.06); color: #fff; display: grid; place-items: center; flex-shrink: 0;
}
.btn-tema svg { width: 20px; height: 20px; }
.chevrones {
  height: 8px;
  background: repeating-linear-gradient(135deg, var(--ambar) 0 14px, #15212b 14px 28px);
}

/* ---------- Progreso (odómetro de etapas) ---------- */
.progreso { max-width: 560px; margin: 0 auto; padding: 14px 16px 0; }
.progreso-barras { display: flex; gap: 4px; }
.progreso-barras span { flex: 1; height: 6px; border-radius: 3px; background: var(--linea); transition: background .3s; }
.progreso-barras span.hecha { background: var(--verde); }
.progreso-barras span.actual { background: var(--ambar); }
.progreso-texto { display: flex; justify-content: space-between; margin-top: 6px; font-size: 13px; color: var(--ink-3); text-transform: uppercase; letter-spacing: .06em; font-weight: 600; }

/* ---------- Contenido ---------- */
main { max-width: 560px; margin: 0 auto; padding: 16px 16px 120px; }
.etapa { animation: entrar .25s ease-out; }
@keyframes entrar { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.ojal { font-size: 13px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--ambar-ink); margin-bottom: 6px; }
.titulo { font-size: 34px; font-weight: 800; text-transform: uppercase; letter-spacing: .01em; }
.subtitulo { color: var(--ink-2); margin-top: 6px; margin-bottom: 18px; max-width: 60ch; }

.tarjeta {
  background: var(--panel); border: 1px solid var(--linea); border-radius: var(--radio);
  padding: 16px; box-shadow: var(--sombra);
}
.pila { display: flex; flex-direction: column; gap: 14px; }

/* Campos */
.campo { display: flex; flex-direction: column; gap: 6px; }
.campo label { font-size: 14px; font-weight: 600; color: var(--ink-2); letter-spacing: .02em; }
.campo input, .campo select, .campo textarea {
  min-height: var(--toque); padding: 12px 14px; border-radius: 12px;
  border: 1.5px solid var(--linea-2); background: var(--panel); color: var(--ink); width: 100%;
}
.campo input:focus, .campo select:focus { outline: none; border-color: var(--ambar); box-shadow: 0 0 0 3px var(--ambar-suave); }
.campo input[readonly] { background: var(--panel-2); color: var(--ink-2); }
.campo .ayuda { font-size: 13px; color: var(--ink-3); }
.fila-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media (max-width: 420px) { .fila-2 { grid-template-columns: 1fr; } }

/* Preguntas */
.pregunta { padding: 16px 0; border-bottom: 1px dashed var(--linea); }
.pregunta:last-child { border-bottom: 0; padding-bottom: 4px; }
.pregunta-texto { font-weight: 600; font-size: 18px; margin-bottom: 12px; }
.pregunta-texto small { display: block; font-weight: 400; font-size: 14px; color: var(--ink-3); margin-top: 2px; }
.opciones { display: flex; gap: 8px; flex-wrap: wrap; }
.opcion {
  flex: 1 1 calc(50% - 8px); min-height: var(--toque); min-width: 0;
  border: 1.5px solid var(--linea-2); border-radius: 12px; background: var(--panel-2);
  font-weight: 600; font-size: 17px; padding: 8px 10px;
  display: flex; align-items: center; justify-content: center; gap: 8px;
  transition: background .15s, border-color .15s, transform .05s;
}
.opcion:active { transform: scale(.98); }
.opcion.activa { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.opcion svg { width: 20px; height: 20px; flex-shrink: 0; }
.escala { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.escala .opcion { flex: unset; font-family: var(--f-display); font-size: 24px; font-weight: 700; padding: 0; }
.escala-ext { display: flex; justify-content: space-between; margin-top: 6px; font-size: 13px; color: var(--ink-3); }

/* Avisos */
.aviso { display: flex; gap: 12px; padding: 14px; border-radius: 12px; border: 1px solid; align-items: flex-start; }
.aviso svg { width: 22px; height: 22px; flex-shrink: 0; margin-top: 1px; }
.aviso.info { background: var(--azul-suave); border-color: var(--azul); color: var(--ink); }
.aviso.ambar { background: var(--ambar-suave); border-color: var(--ambar); color: var(--ink); }
.aviso.verde { background: var(--verde-suave); border-color: var(--verde); color: var(--ink); }
.aviso.rojo { background: var(--rojo-suave); border-color: var(--rojo); color: var(--ink); }
.aviso b { display: block; }

/* Botones */
.btn {
  min-height: var(--toque); padding: 12px 20px; border-radius: 12px; border: 1.5px solid transparent;
  font-weight: 700; font-size: 17px; display: inline-flex; align-items: center; justify-content: center; gap: 10px;
  width: 100%; transition: transform .05s, filter .15s;
}
.btn:active { transform: scale(.985); }
a.btn { text-decoration: none; }
.btn svg { width: 20px; height: 20px; }
.btn.primario { background: var(--ambar); color: #15212b; }
.btn.primario:hover { filter: brightness(1.05); }
.btn.oscuro { background: var(--ink); color: var(--bg); }
.btn.verde { background: var(--verde); color: #fff; }
.btn.fantasma { background: transparent; border-color: var(--linea-2); color: var(--ink-2); }
.btn:disabled { opacity: .45; cursor: not-allowed; filter: none; }

/* Barra inferior fija */
.pie {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
  background: var(--panel); border-top: 1px solid var(--linea);
  padding: 10px 16px calc(10px + env(safe-area-inset-bottom, 0px));
}
.pie-int { max-width: 560px; margin: 0 auto; display: flex; gap: 10px; align-items: center; }
.pie-int .btn.fantasma { width: auto; flex: 0 0 auto; padding-inline: 16px; }
.pie-estado { font-size: 13px; color: var(--ink-3); text-align: center; margin-top: 6px; }

/* ---------- Barrera GPS ---------- */
.gps-cabecera { display: flex; align-items: center; gap: 12px; }
.gps-icono { width: 48px; height: 48px; border-radius: 12px; background: var(--azul-suave); color: var(--azul); display: grid; place-items: center; flex-shrink: 0; }
.gps-icono svg { width: 28px; height: 28px; }
.bitacora { font-size: 14px; color: var(--ink-2); display: flex; flex-direction: column; gap: 6px; margin-top: 12px; }
.bitacora div { display: flex; gap: 8px; align-items: flex-start; }
.bitacora .punto { width: 8px; height: 8px; border-radius: 50%; background: var(--azul); margin-top: 7px; flex-shrink: 0; }
.bitacora .punto.ok { background: var(--verde); }
.bitacora .punto.mal { background: var(--rojo); }
.bitacora .punto.espera { animation: latido 1s infinite; }
@keyframes latido { 50% { opacity: .3; } }

.tablero { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.indicador { background: var(--panel-2); border: 1px solid var(--linea); border-radius: 12px; padding: 12px; min-width: 0; }
.indicador .k { font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); }
.indicador .v { font-family: var(--f-display); font-size: 34px; font-weight: 800; line-height: 1; margin-top: 4px; font-variant-numeric: tabular-nums; }
.indicador .v small { font-size: 16px; font-weight: 600; color: var(--ink-2); margin-left: 2px; }
.indicador .d { font-size: 13px; color: var(--ink-2); margin-top: 4px; }
.indicador.ancho { grid-column: 1 / -1; }
.medidor { height: 10px; border-radius: 5px; background: var(--linea); overflow: hidden; margin-top: 8px; position: relative; }
.medidor > i { display: block; height: 100%; border-radius: 5px; background: var(--verde); transition: width .5s; }
.medidor > i.ambar { background: var(--ambar); }
.medidor > i.rojo { background: var(--rojo); }
.medidor-marcas { display: flex; justify-content: space-between; font-size: 12px; color: var(--ink-3); margin-top: 4px; font-variant-numeric: tabular-nums; }

.bloqueo {
  border-radius: var(--radio); overflow: hidden; border: 2px solid var(--rojo); background: var(--panel);
}
.bloqueo .franja { height: 10px; background: repeating-linear-gradient(135deg, var(--rojo) 0 14px, #15212b 14px 28px); }
.bloqueo-cuerpo { padding: 18px 16px; }
.bloqueo h2 { font-size: 30px; text-transform: uppercase; color: var(--rojo-ink); }
.cuenta { margin-top: 14px; background: var(--panel-2); border-radius: 12px; padding: 14px; text-align: center; }
.cuenta .k { font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); }
.cuenta .reloj { font-family: var(--f-display); font-size: 52px; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; margin: 4px 0; }
.cuenta .h { font-size: 15px; color: var(--ink-2); }

.permiso { border-radius: var(--radio); border: 2px solid var(--verde); background: var(--panel); overflow: hidden; }
.permiso .franja { height: 10px; background: var(--verde); }
.permiso-cuerpo { padding: 18px 16px; }
.permiso h2 { font-size: 30px; text-transform: uppercase; color: var(--verde-ink); }

/* Lista de verificación de confirmación */
.resumen { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 14px; font-size: 15px; }
.resumen .k { color: var(--ink-3); font-size: 12px; text-transform: uppercase; letter-spacing: .06em; font-weight: 700; }
.resumen .v { font-weight: 600; overflow-wrap: anywhere; }
.casilla { display: flex; gap: 12px; align-items: flex-start; padding: 14px; border: 1.5px solid var(--linea-2); border-radius: 12px; background: var(--panel-2); cursor: pointer; }
.casilla input { width: 26px; height: 26px; margin: 2px 0 0; accent-color: var(--verde); flex-shrink: 0; }
.casilla span { font-size: 15px; }
.firma { border: 1.5px dashed var(--linea-2); border-radius: 12px; background: var(--panel-2); position: relative; }
.firma canvas { width: 100%; height: 140px; display: block; touch-action: none; border-radius: 12px; }
.firma .pista { position: absolute; left: 0; right: 0; bottom: 8px; text-align: center; font-size: 13px; color: var(--ink-3); pointer-events: none; }
.firma .limpiar { position: absolute; top: 8px; right: 8px; font-size: 13px; padding: 6px 10px; border-radius: 8px; border: 1px solid var(--linea-2); background: var(--panel); color: var(--ink-2); }

/* ---------- Resultado (letrero) ---------- */
.letrero { border-radius: 18px; padding: 26px 20px; text-align: center; color: #fff; box-shadow: var(--sombra); position: relative; }
.letrero::after { content: ""; position: absolute; inset: 8px; border: 3px solid rgba(255,255,255,.85); border-radius: 12px; pointer-events: none; }
.letrero.apto { background: var(--verde); }
.letrero.noapto { background: var(--rojo); }
.letrero .ojal { color: rgba(255,255,255,.85); }
.letrero h2 { font-size: 64px; font-weight: 800; text-transform: uppercase; letter-spacing: .02em; line-height: .95; }
.letrero p { margin-top: 8px; font-size: 18px; font-weight: 500; }
.letrero .folio { margin-top: 12px; font-size: 13px; opacity: .85; letter-spacing: .08em; text-transform: uppercase; }
.factores { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.factores li { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border-radius: 10px; background: var(--panel-2); border: 1px solid var(--linea); font-size: 15px; }
.factores .sev { flex-shrink: 0; font-size: 11px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; padding: 3px 7px; border-radius: 6px; margin-top: 2px; }
.sev.critico { background: var(--rojo); color: #fff; }
.sev.riesgo { background: var(--ambar); color: #15212b; }
.sev.ok { background: var(--verde); color: #fff; }
.acciones { display: flex; flex-direction: column; gap: 10px; }
.historial { font-size: 14px; color: var(--ink-2); }
.historial li { display: flex; justify-content: space-between; gap: 10px; padding: 8px 0; border-bottom: 1px dashed var(--linea); }
.historial ul { list-style: none; padding: 0; margin: 8px 0 0; }
.etiqueta { font-size: 12px; font-weight: 800; letter-spacing: .06em; padding: 3px 8px; border-radius: 6px; text-transform: uppercase; flex-shrink: 0; }
.etiqueta.apto { background: var(--verde-suave); color: var(--verde-ink); }
.etiqueta.noapto { background: var(--rojo-suave); color: var(--rojo-ink); }
.demo { font-size: 13px; color: var(--ink-3); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.demo select { min-height: 40px; border-radius: 8px; border: 1px solid var(--linea-2); background: var(--panel); padding: 6px 8px; font-size: 14px; max-width: 100%; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
.aviso-toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(96px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-size: 14px; z-index: 20; box-shadow: var(--sombra); }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>

<header class="cabecera">
  <div class="cabecera-int">
    <div class="marca">
      <div class="marca-icono" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="#15212b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 7h12v9H1z"/><path d="M13 10h4l3 3v3h-7z"/><circle cx="5" cy="18" r="2"/><circle cx="17" cy="18" r="2"/></svg>
      </div>
      <div class="marca-texto">
        <div class="t">Pre-Viaje</div>
        <div class="s">Autoevaluación del operador</div>
      </div>
    </div>
    <button class="btn-tema" id="btnTema" type="button" aria-label="Cambiar modo día o noche" title="Modo día / noche">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
  </div>
  <div class="chevrones" aria-hidden="true"></div>
</header>

<div class="progreso" id="progreso" hidden>
  <div class="progreso-barras" id="progresoBarras"></div>
  <div class="progreso-texto"><span id="progresoNombre"></span><span id="progresoNum"></span></div>
</div>

<main id="vista" aria-live="polite"></main>

<footer class="pie" id="pie" hidden>
  <div class="pie-int">
    <button class="btn fantasma" id="btnAtras" type="button">Atrás</button>
    <button class="btn primario" id="btnSiguiente" type="button">Continuar</button>
  </div>
  <div class="pie-estado" id="pieEstado"></div>
</footer>

<script>
/* =====================================================================
   CONFIGURACIÓN DE REGLAS DE FATIGA (ajustable por Seguridad)
   Referencia: NOM-087-SCT-2-2017 (tiempos de conducción y pausas).
   ===================================================================== */
const REGLAS = {
  maxConduccion: 14,     // h de conducción continua. Al llegar aquí: descanso obligatorio
  descansoEfectivo: 8,   // h mínimas de descanso efectivo tras alcanzar el máximo
  pausaReinicio: 6,      // h: una pausa de esta duración o mayor cierra la jornada y permite continuar
  ventanaDescanso: 24,   // h previas a la encuesta en las que debe existir un descanso efectivo
  avisoRestante: 2,      // h restantes a partir de las cuales se muestra advertencia ámbar
  puntosNoApto: 4        // suma de puntos de riesgo (no críticos) que vuelve NO APTO
};

/* =====================================================================
   PROVEEDOR GPS
   En producción, reemplace `consultarActividad` por la llamada a la
   plataforma de telemetría (Geotab, Samsara, Webfleet, Copiloto, etc.):
   debe devolver { unidad, ubicacion:{lat,lon,texto}, desde:Date, segmentos:[{inicio:Date, fin:Date}] }
   con los periodos de conducción (motor en movimiento) desde `desde` (últimas 36 h).
   ===================================================================== */
const DEMO = {

const GPS_PROVIDER = {
  async consultarActividad(economico) {
    await esperar(900);
    const eco = economico.trim().toUpperCase();
    const d = DEMO[eco];
    if (!d) throw new Error('La unidad ' + eco + ' no está registrada en la plataforma GPS.');
    if (!d.seg) throw new Error('La unidad ' + eco + ' no reporta señal desde hace más de 2 horas.');
    const ahora = Date.now();
    return {
      unidad: eco,
      ubicacion: { texto: d.ubicacion },
      desde: new Date(ahora - 36 * 3600e3),
      segmentos: d.seg.map(([a, b]) => ({ inicio: new Date(ahora - a * 3600e3), fin: new Date(ahora - b * 3600e3) }))
    };
  }
};
const esperar = ms => new Promise(r => setTimeout(r, ms));

/* =====================================================================
   ANÁLISIS DE HORAS DE CONDUCCIÓN
   ===================================================================== */
function analizarActividad(segmentos, ahora = new Date(), desde = null) {
  const H = 3600e3;
  const segs = [...segmentos].sort((a, b) => a.inicio - b.inicio);
  const jornadas = [];
  let actual = null, prevFin = null, ultimoDescanso = null;
  if (desde && segs.length && (segs[0].inicio - desde) / H >= REGLAS.descansoEfectivo) {
    ultimoDescanso = { inicio: desde, fin: segs[0].inicio, horas: (segs[0].inicio - desde) / H, enCurso: false };
  }
  for (const s of segs) {
    if (prevFin) {
      const pausa = (s.inicio - prevFin) / H;
      if (pausa >= REGLAS.pausaReinicio && actual) { jornadas.push(actual); actual = null; }
      if (pausa >= REGLAS.descansoEfectivo) ultimoDescanso = { inicio: prevFin, fin: s.inicio, horas: pausa, enCurso: false };
    }
    if (!actual) actual = { inicio: s.inicio, fin: s.fin, horas: 0 };
    actual.horas += (s.fin - s.inicio) / H;
    actual.fin = s.fin;
    prevFin = s.fin;
  }
  if (actual) jornadas.push(actual);
  const ultima = jornadas[jornadas.length - 1];
  const pausaActual = prevFin ? (ahora - prevFin) / H : Infinity;
  if (prevFin && pausaActual >= REGLAS.descansoEfectivo) ultimoDescanso = { inicio: prevFin, fin: null, horas: pausaActual, enCurso: true };

  const descansoVigente = !!ultimoDescanso && (ultimoDescanso.enCurso || (ahora - ultimoDescanso.fin) / H <= REGLAS.ventanaDescanso);
  const jornadaAbierta = !!ultima && pausaActual < REGLAS.pausaReinicio;
  const horasJornada = jornadaAbierta ? ultima.horas : 0;
  const alcanzoMaximo = !!ultima && ultima.horas >= REGLAS.maxConduccion && pausaActual < REGLAS.descansoEfectivo;

  const r = { horasJornada, horasUltimaJornada: ultima ? ultima.horas : 0, pausaActual, ultimoDescanso, descansoVigente, jornadaAbierta,
              restante: Math.max(0, REGLAS.maxConduccion - horasJornada), estado: 'permitido', motivo: '', esperaHoras: 0, advertencia: '' };

  if (alcanzoMaximo) {
    r.estado = 'bloqueado';
    r.codigo = 'MAX_CONDUCCION';
    r.motivo = 'Condujo ' + fmtH(ultima.horas) + ' continuas y el máximo es ' + REGLAS.maxConduccion + ' h. Le corresponde un descanso efectivo mínimo de ' + REGLAS.descansoEfectivo + ' h.';
    r.esperaHoras = REGLAS.descansoEfectivo - pausaActual;
  } else if (!descansoVigente) {
    r.estado = 'bloqueado';
    r.codigo = 'SIN_DESCANSO_24H';
    r.motivo = 'No registra un descanso efectivo de ' + REGLAS.descansoEfectivo + ' h dentro de las últimas ' + REGLAS.ventanaDescanso + ' h. Debe completar su descanso antes de evaluarse.';
    r.esperaHoras = Math.max(0, REGLAS.descansoEfectivo - (isFinite(pausaActual) ? pausaActual : 0));
  } else if (r.restante <= REGLAS.avisoRestante) {
    r.advertencia = 'Le queda' + (r.restante === 1 ? '' : 'n') + ' ' + fmtH(r.restante) + ' de conducción antes del descanso obligatorio. Planee su parada.';
  }
  return r;
}
function fmtH(h) {
  if (!isFinite(h)) return '—';
  const hh = Math.floor(h + 1e-9), mm = Math.round((h - hh) * 60);
  if (mm === 60) return (hh + 1) + ' h';
  return mm ? hh + ' h ' + String(mm).padStart(2, '0') + ' min' : hh + ' h';
}
const fmtHora = d => d ? new Date(d).toLocaleTimeString('es-MX', { hour: '2-digit', minute: '2-digit' }) : '—';
const fmtFecha = d => new Date(d).toLocaleDateString('es-MX', { weekday: 'short', day: '2-digit', month: 'short', year: 'numeric' });
const fmtFechaHora = d => fmtFecha(d) + ' ' + fmtHora(d);

function log(texto, clase) {
  const b = $('#bitacora'); if (!b) return;
  b.insertAdjacentHTML('beforeend', '<div><span class="punto ' + (clase || '') + '"></span><span>' + texto + '</span></div>');
}
function reemplazarUltimoLog(texto, clase) {
  const b = $('#bitacora'); if (!b || !b.lastElementChild) return;
  b.lastElementChild.innerHTML = '<span class="punto ' + (clase || '') + '"></span><span>' + texto + '</span>';
}

async function conectarGps() {
  const eco = $('#ecoGps').value.trim().toUpperCase();
  if (!eco) { toast('Escriba el número económico de la unidad.'); $('#ecoGps').focus(); return; }
  const btn = $('#btnConectar'); btn.disabled = true;
  $('#bitacora').innerHTML = ''; $('#veredictoGps').innerHTML = '';
  estado.datos.economico = eco; estado.gps = null;
  log('Buscando la unidad <b>' + esc(eco) + '</b> en la plataforma GPS…', 'espera');

  // Ubicación del teléfono (opcional, no bloquea)
  if (navigator.geolocation && !estado.posicion) {
    navigator.geolocation.getCurrentPosition(p => { estado.posicion = { lat: p.coords.latitude, lon: p.coords.longitude }; }, () => {}, { timeout: 5000, maximumAge: 60000 });
  }

  try {
    const r = await GPS_PROVIDER.consultarActividad(eco);
    reemplazarUltimoLog('Unidad <b>' + esc(r.unidad) + '</b> encontrada · Última posición: ' + esc(r.ubicacion.texto), 'ok');
    log('Leyendo periodos de conducción de las últimas 36 h…', 'espera');
    await esperar(600);
    const a = analizarActividad(r.segmentos, new Date(), r.desde);
    reemplazarUltimoLog('Análisis de horas completado.', 'ok');
    estado.gps = { unidad: r.unidad, ubicacion: r.ubicacion.texto, segmentos: r.segmentos, desde: r.desde, analisis: a, origen: 'gps', consultadoEn: new Date() };
    pintarVeredictoGps();
  } catch (err) {
    reemplazarUltimoLog(esc(err.message), 'mal');
    pintarFalloGps();
  } finally { btn.disabled = false; }
}

function pintarFalloGps() {
  $('#veredictoGps').innerHTML =
    '<div class="pila">' +
    '<div class="aviso ambar">' + ICONO.alerta + '<div><b>No se pudo verificar con el GPS</b>Revise el número económico o intente de nuevo. Si la unidad no tiene señal, puede registrar sus horas de forma manual; la evaluación quedará marcada para validación de Cabina de Seguridad.</div></div>' +
    '<div class="tarjeta pila" id="manualBox">' +
      '<b>Registro manual de horas</b>' +
      '<div class="campo"><label for="mFinDescanso">¿A qué hora terminó su último descanso de ' + REGLAS.descansoEfectivo + ' h o más?</label><input id="mFinDescanso" type="datetime-local"></div>' +
      '<div class="campo"><label for="mHoras">¿Cuántas horas ha manejado desde ese descanso?</label><input id="mHoras" type="number" inputmode="decimal" min="0" max="24" step="0.5" placeholder="Ej. 6.5"></div>' +
      '<div class="campo"><label for="mPausa">¿Hace cuántas horas apagó la unidad por última vez?</label><input id="mPausa" type="number" inputmode="decimal" min="0" max="24" step="0.5" placeholder="Ej. 0.5"><div class="ayuda">Ponga 0 si acaba de detenerse.</div></div>' +
      '<button class="btn primario" id="btnManual" type="button">Registrar horas declaradas</button>' +
    '</div></div>';
  $('#btnManual').addEventListener('click', () => {
    const fin = $('#mFinDescanso').value, horas = parseFloat($('#mHoras').value), pausa = parseFloat($('#mPausa').value);
    if (!fin || isNaN(horas) || isNaN(pausa)) { toast('Complete los tres datos para continuar.'); return; }
    const finD = new Date(fin), ahora = new Date();
    if (finD > ahora) { toast('La hora del descanso no puede ser futura.'); return; }
    const inicioDesc = new Date(finD.getTime() - REGLAS.descansoEfectivo * 3600e3);
    const finCond = new Date(ahora.getTime() - pausa * 3600e3);
    const inicioCond = new Date(finCond.getTime() - horas * 3600e3);
    const segmentos = [{ inicio: new Date(inicioDesc.getTime() - 3600e3), fin: inicioDesc }];
    if (horas > 0 && inicioCond >= finD) segmentos.push({ inicio: inicioCond, fin: finCond });
    else if (horas > 0) segmentos.push({ inicio: finD, fin: finCond });
    const a = analizarActividad(segmentos, ahora);
    estado.gps = { unidad: estado.datos.economico, ubicacion: 'Sin señal GPS', segmentos, analisis: a, origen: 'manual', consultadoEn: ahora };
    pintarVeredictoGps();
  });
}

function pintarVeredictoGps() {
  const g = estado.gps; if (!g) return;
  const a = analizarActividad(g.segmentos, new Date(), g.desde);
  g.analisis = a;
  const porcentaje = Math.min(100, (a.horasJornada / REGLAS.maxConduccion) * 100);
  const colorMedidor = a.estado === 'bloqueado' ? 'rojo' : a.restante <= REGLAS.avisoRestante ? 'ambar' : '';
  const descansoTxt = a.ultimoDescanso
    ? (a.ultimoDescanso.enCurso ? 'En curso · lleva ' + fmtH(a.ultimoDescanso.horas) : fmtH(a.ultimoDescanso.horas) + ' · terminó ' + fmtHora(a.ultimoDescanso.fin))
    : 'Sin registro en 36 h';

  let html = '<div class="pila">';
  if (g.origen === 'manual') html += '<div class="aviso ambar">' + ICONO.alerta + '<div><b>Horas declaradas por el operador</b>No se verificaron con GPS. Cabina de Seguridad debe validar antes de autorizar la salida.</div></div>';

  html += '<div class="tarjeta"><div class="ojal">Tablero de horas · ' + esc(g.unidad) + '</div><div class="tablero">' +
    '<div class="indicador ancho"><div class="k">Conducción en la jornada actual</div><div class="v">' + esc(fmtH(a.horasJornada)) + '<small>de ' + REGLAS.maxConduccion + ' h</small></div>' +
      '<div class="medidor"><i class="' + colorMedidor + '" style="width:' + porcentaje.toFixed(1) + '%"></i></div><div class="medidor-marcas"><span>0</span><span>7 h</span><span>' + REGLAS.maxConduccion + ' h</span></div></div>' +
    '<div class="indicador"><div class="k">Último descanso ≥ ' + REGLAS.descansoEfectivo + ' h</div><div class="d" style="font-weight:600;color:var(--ink);font-size:15px;margin-top:6px">' + esc(descansoTxt) + '</div></div>' +
    '<div class="indicador"><div class="k">Pausa actual</div><div class="v" style="font-size:26px">' + esc(fmtH(a.pausaActual)) + '</div><div class="d">' + (a.jornadaAbierta ? 'La jornada sigue abierta' : 'Jornada cerrada') + '</div></div>' +
    '</div></div>';

  if (a.estado === 'bloqueado') {
    const fin = new Date(Date.now() + a.esperaHoras * 3600e3);
    html += '<div class="bloqueo"><div class="franja"></div><div class="bloqueo-cuerpo">' +
      '<div class="ojal" style="color:var(--rojo-ink)">Por el momento no puede realizar la prueba</div>' +
      '<h2>Descanso obligatorio</h2><p style="margin-top:8px">' + esc(a.motivo) + '</p>' +
      '<div class="cuenta"><div class="k">Podrá presentar la evaluación en</div><div class="reloj" id="reloj">' + esc(fmtH(a.esperaHoras)) + '</div><div class="h">a partir de las <b>' + fmtHora(fin) + '</b>' + (fin.getDate() !== new Date().getDate() ? ' de mañana' : '') + '</div></div>' +
      '<p style="margin-top:14px;font-size:15px;color:var(--ink-2)">Apague la unidad, busque un parador seguro y descanse. Cabina de Seguridad ya tiene este registro. Si cree que es un error, repórtelo por radio o WhatsApp.</p>' +
      '</div></div>' +
      '<button class="btn fantasma" id="btnReconsultar" type="button">' + ICONO.reloj + ' Volver a consultar</button>';
  } else {
    html += '<div class="permiso"><div class="franja"></div><div class="permiso-cuerpo pila">' +
      '<div><div class="ojal" style="color:var(--verde-ink)">Horas en regla</div><h2>Puede presentar la evaluación</h2></div>' +
      (a.advertencia ? '<div class="aviso ambar">' + ICONO.alerta + '<div>' + esc(a.advertencia) + '</div></div>' : '') +
      '<p style="font-size:15px;color:var(--ink-2)">Descanso efectivo vigente y ' + esc(fmtH(a.restante)) + ' disponibles de conducción. Tiempo estimado de la encuesta: 3 minutos.</p>' +
      '<button class="btn verde" id="btnIniciar" type="button">Iniciar evaluación ' + ICONO.check + '</button>' +
      '</div></div>';
  }
  html += '</div>';
  $('#veredictoGps').innerHTML = html;

  if (a.estado === 'bloqueado') {
    $('#btnReconsultar').addEventListener('click', pintarVeredictoGps);
    temporizador = setInterval(() => {
      const b = analizarActividad(g.segmentos, new Date(), g.desde);
      if (b.estado !== 'bloqueado') { pintarVeredictoGps(); return; }
      const r = $('#reloj'); if (r) r.textContent = fmtH(b.esperaHoras);
    }, 30000);
  } else {
    $('#btnIniciar').addEventListener('click', () => { estado.datos.fecha = new Date().toISOString(); estado.paso = 0; render(); });
  }
}

/* ---------- Secciones ---------- */
function renderSeccion() {
  const s = SECCIONES[estado.paso];
  let html = '<section class="etapa pila"><div><div class="ojal">' + esc(s.ojal) + '</div><h1 class="titulo">' + esc(s.titulo) + '</h1><p class="subtitulo">' + esc(s.sub) + '</p></div>';
  if (s.id === 'datos') html += renderDatos();
  else if (s.id === 'confirmacion') html += renderConfirmacion();
  else html += '<div class="tarjeta">' + s.preguntas.map(renderPregunta).join('') + '</div>';
  html += '</section>';
  vista.innerHTML = html;
  if (s.id === 'datos') enlazarDatos();
  else if (s.id === 'confirmacion') enlazarConfirmacion();
  else enlazarPreguntas(s);
  actualizarPie();
}

function renderDatos() {
  const d = estado.datos, g = estado.gps;
  return '<div class="tarjeta pila">' +
    '<div class="campo"><label for="fNombre">Nombre completo del operador</label><input id="fNombre" autocomplete="name" placeholder="Nombre y apellidos" value="' + esc(d.nombre) + '"></div>' +
    '<div class="fila-2">' +
      '<div class="campo"><label for="fEco">Número económico</label><input id="fEco" readonly value="' + esc(d.economico) + '"><div class="ayuda">Verificado por GPS' + (g && g.origen === 'manual' ? ' (manual)' : '') + '</div></div>' +
      '<div class="campo"><label for="fFecha">Fecha y hora</label><input id="fFecha" readonly value="' + esc(fmtFechaHora(d.fecha)) + '"></div>' +
    '</div>' +
    '<div class="campo"><label for="fRuta">Ruta de hoy</label><input id="fRuta" list="rutas" placeholder="Origen → Destino" value="' + esc(d.ruta) + '">' +
      '<datalist id="rutas"><option value="Nuevo Laredo → Monterrey"><option value="Monterrey → Querétaro"><option value="Querétaro → CDMX"><option value="Manzanillo → Guadalajara"><option value="Veracruz → Puebla"><option value="Altamira → San Luis Potosí"></datalist>' +
      '<div class="ayuda">Posición actual: ' + esc(g ? g.ubicacion : '—') + (estado.posicion ? ' · Teléfono: ' + estado.posicion.lat.toFixed(4) + ', ' + estado.posicion.lon.toFixed(4) : '') + '</div></div>' +
    '</div>';
}
function enlazarDatos() {
  $('#fNombre').addEventListener('input', e => { estado.datos.nombre = e.target.value; actualizarPie(); });
  $('#fRuta').addEventListener('input', e => { estado.datos.ruta = e.target.value; actualizarPie(); });
}

function renderPregunta(q) {
  const v = estado.respuestas[q.id];
  let cuerpo = '';
  if (q.tipo === 'sino') {
    cuerpo = '<div class="opciones" role="group" aria-label="' + esc(q.texto) + '">' +
      '<button type="button" class="opcion' + (v === SI ? ' activa' : '') + '" data-q="' + q.id + '" data-v="si">' + ICONO.check + ' Sí</button>' +
      '<button type="button" class="opcion' + (v === NO ? ' activa' : '') + '" data-q="' + q.id + '" data-v="no">' + ICONO.x + ' No</button></div>';
  } else if (q.tipo === 'escala') {
    cuerpo = '<div class="escala" role="group" aria-label="' + esc(q.texto) + '">' +
      [1, 2, 3, 4, 5].map(n => '<button type="button" class="opcion' + (v === n ? ' activa' : '') + '" data-q="' + q.id + '" data-v="' + n + '" aria-label="' + n + ' de 5">' + n + '</button>').join('') +
      '</div><div class="escala-ext"><span>1 · ' + esc(q.min) + '</span><span>5 · ' + esc(q.max) + '</span></div>';
  } else {
    cuerpo = '<div class="opciones" role="group" aria-label="' + esc(q.texto) + '">' +
      q.opciones.map(o => '<button type="button" class="opcion' + (v === o.v ? ' activa' : '') + '" data-q="' + q.id + '" data-v="' + esc(o.v) + '">' + esc(o.l) + '</button>').join('') + '</div>';
  }
  return '<div class="pregunta" id="p-' + q.id + '"><div class="pregunta-texto">' + esc(q.texto) + (q.ayuda ? '<small>' + esc(q.ayuda) + '</small>' : '') + '</div>' + cuerpo + '</div>';
}
function enlazarPreguntas(s) {
  vista.querySelectorAll('.opcion').forEach(b => b.addEventListener('click', () => {
    const q = s.preguntas.find(x => x.id === b.dataset.q);
    estado.respuestas[q.id] = q.tipo === 'escala' ? Number(b.dataset.v) : b.dataset.v;
    b.parentElement.querySelectorAll('.opcion').forEach(x => x.classList.toggle('activa', x === b));
    actualizarPie();
  }));
}

function renderConfirmacion() {
  const d = estado.datos, g = estado.gps;
  const contestadas = SECCIONES.filter(s => s.preguntas).reduce((n, s) => n + s.preguntas.filter(q => estado.respuestas[q.id] !== undefined).length, 0);
  return '<div class="pila">' +
    '<div class="tarjeta"><div class="ojal">Resumen</div><div class="resumen">' +
      '<div><div class="k">Operador</div><div class="v">' + esc(d.nombre) + '</div></div>' +
      '<div><div class="k">Unidad</div><div class="v">' + esc(d.economico) + '</div></div>' +
      '<div><div class="k">Ruta</div><div class="v">' + esc(d.ruta) + '</div></div>' +
      '<div><div class="k">Fecha</div><div class="v">' + esc(fmtFechaHora(d.fecha)) + '</div></div>' +
      '<div><div class="k">Conducción jornada</div><div class="v">' + esc(fmtH(g.analisis.horasJornada)) + '</div></div>' +
      '<div><div class="k">Respuestas</div><div class="v">' + contestadas + ' de 15</div></div>' +
    '</div></div>' +
    '<label class="casilla"><input type="checkbox" id="chkAcepta"' + (estado.acepta ? ' checked' : '') + '><span>Declaro que mis respuestas son verdaderas, que revisé físicamente la unidad y que me comprometo a reportar a Cabina de Seguridad cualquier cambio en mi estado o en la unidad durante la ruta.</span></label>' +
    '<div><div class="ojal">Firma del operador</div><div class="firma"><canvas id="firmaCanvas" aria-label="Área para firmar con el dedo"></canvas><div class="pista" id="firmaPista">Firme aquí con el dedo</div><button type="button" class="limpiar" id="firmaLimpiar">Borrar</button></div></div>' +
    '</div>';
}
function enlazarConfirmacion() {
  $('#chkAcepta').addEventListener('change', e => { estado.acepta = e.target.checked; actualizarPie(); });
  const c = $('#firmaCanvas'), ctx = c.getContext('2d');
  const ajustar = () => { const r = c.getBoundingClientRect(), dpr = window.devicePixelRatio || 1; c.width = r.width * dpr; c.height = r.height * dpr; ctx.scale(dpr, dpr); ctx.lineWidth = 2.5; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue('--ink').trim(); };
  ajustar();
  let dibujando = false;
  const pos = e => { const r = c.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
  c.addEventListener('pointerdown', e => { dibujando = true; c.setPointerCapture(e.pointerId); const [x, y] = pos(e); ctx.beginPath(); ctx.moveTo(x, y); });
  c.addEventListener('pointermove', e => { if (!dibujando) return; const [x, y] = pos(e); ctx.lineTo(x, y); ctx.stroke(); if (!estado.firma) { estado.firma = true; $('#firmaPista').hidden = true; actualizarPie(); } });
  const fin = () => { dibujando = false; };
  c.addEventListener('pointerup', fin); c.addEventListener('pointercancel', fin);
  $('#firmaLimpiar').addEventListener('click', () => { ctx.clearRect(0, 0, c.width, c.height); estado.firma = false; $('#firmaPista').hidden = false; actualizarPie(); });
}

/* ---------- Pie / navegación ---------- */
function pendientes() {
  const s = SECCIONES[estado.paso];
  if (s.id === 'datos') return (estado.datos.nombre.trim().length < 5 ? 1 : 0) + (estado.datos.ruta.trim().length < 3 ? 1 : 0);
  if (s.id === 'confirmacion') return (estado.acepta ? 0 : 1) + (estado.firma ? 0 : 1);
  return s.preguntas.filter(q => estado.respuestas[q.id] === undefined).length;
}
function actualizarPie() {
  const n = pendientes(), ultimo = estado.paso === SECCIONES.length - 1;
  const btn = $('#btnSiguiente');
  btn.disabled = n > 0;
  btn.innerHTML = ultimo ? 'Enviar y ver dictamen ' + ICONO.check : 'Continuar';
  btn.classList.toggle('verde', ultimo); btn.classList.toggle('primario', !ultimo);
  $('#btnAtras').textContent = estado.paso === 0 ? 'GPS' : 'Atrás';
  $('#pieEstado').textContent = n > 0 ? 'Falta' + (n === 1 ? '' : 'n') + ' ' + n + ' ' + (SECCIONES[estado.paso].preguntas ? 'respuesta' : 'dato') + (n === 1 ? '' : 's') : 'Todo listo';
}
$('#btnSiguiente').addEventListener('click', () => {
  if (pendientes() > 0) return;
  if (estado.paso === SECCIONES.length - 1) { calcularResultado(); estado.paso = 5; }
  else estado.paso++;
  render();
});
$('#btnAtras').addEventListener('click', () => { estado.paso--; render(); });

/* ---------- Dictamen ---------- */
function calcularResultado() {
  const factores = []; let puntos = 0, criticos = 0;
  for (const s of SECCIONES) {
    if (!s.preguntas) continue;
    for (const q of s.preguntas) {
      const r = q.riesgo(estado.respuestas[q.id]);
      if (!r) continue;
      if (r.critico) { criticos++; factores.push({ sev: 'critico', t: r.t, seccion: s.nombre }); }
      else { puntos += r.p; factores.push({ sev: 'riesgo', t: r.t + ' (+' + r.p + ')', seccion: s.nombre }); }
    }
  }
  const g = estado.gps.analisis;
  if (g.advertencia) factores.push({ sev: 'riesgo', t: 'GPS: ' + g.advertencia, seccion: 'GPS' });
  if (estado.gps.origen === 'manual') factores.push({ sev: 'riesgo', t: 'Horas de conducción sin verificar por GPS. Requiere validación de Cabina.', seccion: 'GPS' });
  const apto = criticos === 0 && puntos < REGLAS.puntosNoApto;
  const f = new Date(estado.datos.fecha);
  const folio = 'PV-' + f.getFullYear() + String(f.getMonth() + 1).padStart(2, '0') + String(f.getDate()).padStart(2, '0') + '-' + String(f.getHours()).padStart(2, '0') + String(f.getMinutes()).padStart(2, '0') + '-' + estado.datos.economico.replace(/[^A-Z0-9]/g, '');
  estado.resultado = { apto, factores, puntos, criticos, folio, pendienteValidacion: estado.gps.origen === 'manual' };
  try {
    const h = JSON.parse(localStorage.getItem('previaje.historial') || '[]');
    h.unshift({ folio, fecha: estado.datos.fecha, nombre: estado.datos.nombre, economico: estado.datos.economico, ruta: estado.datos.ruta, apto, puntos, criticos });
    localStorage.setItem('previaje.historial', JSON.stringify(h.slice(0, 20)));
  } catch (e) {}
}

function textoResumen() {
  const r = estado.resultado, d = estado.datos, g = estado.gps.analisis;
  return 'PRE-VIAJE · ' + (r.apto ? 'APTO' : 'NO APTO') + (r.pendienteValidacion ? ' (pendiente validación GPS)' : '') + '\n' +
    'Folio: ' + r.folio + '\nOperador: ' + d.nombre + '\nUnidad: ' + d.economico + '\nRuta: ' + d.ruta + '\nFecha: ' + fmtFechaHora(d.fecha) + '\n' +
    'Conducción jornada: ' + fmtH(g.horasJornada) + ' · Disponible: ' + fmtH(g.restante) + '\n' +
    (r.factores.length ? 'Factores:\n' + r.factores.map(x => '- [' + (x.sev === 'critico' ? 'CRÍTICO' : 'RIESGO') + '] ' + x.t).join('\n') : 'Sin factores de riesgo.');
}

function renderResultado() {
  const r = estado.resultado, d = estado.datos;
  let html = '<section class="etapa pila">';
  html += '<div class="letrero ' + (r.apto ? 'apto' : 'noapto') + '"><div class="ojal">Dictamen pre-viaje</div><h2>' + (r.apto ? 'Apto' : 'No apto') + '</h2>' +
    '<p>' + (r.apto ? 'Puede iniciar el viaje. Buen camino, ' + esc(d.nombre.split(' ')[0]) + '.' : 'No salga. Repórtese con Cabina de Seguridad.') + '</p>' +
    '<div class="folio">Folio ' + esc(r.folio) + '</div></div>';
  if (r.pendienteValidacion) html += '<div class="aviso ambar">' + ICONO.alerta + '<div><b>Pendiente de validación</b>Las horas de conducción se declararon sin GPS. Cabina debe validar antes de autorizar la salida.</div></div>';

  html += '<div class="tarjeta"><div class="ojal">' + (r.factores.length ? 'Factores detectados' : 'Sin factores de riesgo') + '</div>';
  if (r.factores.length) {
    html += '<ul class="factores">' + r.factores.map(x => '<li><span class="sev ' + x.sev + '">' + (x.sev === 'critico' ? 'Crítico' : 'Riesgo') + '</span><span>' + esc(x.t) + '</span></li>').join('') + '</ul>' +
      '<p style="font-size:14px;color:var(--ink-3);margin-top:10px">Un factor crítico vuelve NO APTO por sí solo. Los puntos de riesgo suman: ' + r.puntos + ' de ' + REGLAS.puntosNoApto + ' para NO APTO.</p>';
  } else html += '<p style="color:var(--ink-2)">Descanso en regla, sin malestares, unidad revisada y documentos completos.</p>';
  html += '</div>';

  if (!r.apto) html += '<div class="aviso info">' + ICONO.info + '<div><b>¿Qué sigue?</b>Cabina de Seguridad recibe este dictamen. Si el motivo es descanso o salud, se reprograma la salida. Si es la unidad, se levanta reporte a Mantenimiento. Esto no es una sanción: es la decisión correcta.</div></div>';

  html += '<div class="acciones">' +
    '<a class="btn verde" id="btnWa" href="https://wa.me/?text=' + encodeURIComponent(textoResumen()) + '" target="_blank" rel="noopener">' + ICONO.wa + ' Enviar a Cabina por WhatsApp</a>' +
    '<button class="btn fantasma" id="btnCopiar" type="button">' + ICONO.copiar + ' Copiar resumen</button>' +
    '<button class="btn oscuro" id="btnNueva" type="button">Nueva evaluación</button></div>';
  html += renderHistorialCorto();
  html += '</section>';
  vista.innerHTML = html;

  $('#btnCopiar').addEventListener('click', async () => {
    try { await navigator.clipboard.writeText(textoResumen()); toast('Resumen copiado.'); }
    catch (e) { toast('No se pudo copiar automáticamente. Use el botón de WhatsApp.'); }
  });
  $('#btnNueva').addEventListener('click', () => {
    Object.assign(estado, { paso: -1, gps: null, respuestas: {}, firma: false, acepta: false, resultado: null, datos: { nombre: '', economico: '', fecha: '', ruta: '' } });
    render();
  });
}

function renderHistorialCorto() {
  let h = [];
  try { h = JSON.parse(localStorage.getItem('previaje.historial') || '[]'); } catch (e) {}
  if (!h.length) return '';
  return '<div class="tarjeta historial"><div class="ojal">Últimas evaluaciones en este teléfono</div><ul>' +
    h.slice(0, 5).map(x => '<li><span>' + esc(fmtFechaHora(x.fecha)) + ' · ' + esc(x.economico) + ' · ' + esc(x.nombre.split(' ')[0]) + '</span><span class="etiqueta ' + (x.apto ? 'apto' : 'noapto') + '">' + (x.apto ? 'Apto' : 'No apto') + '</span></li>').join('') + '</ul></div>';
}

function toast(msg) {
  const t = document.createElement('div'); t.className = 'aviso-toast'; t.textContent = msg; t.setAttribute('role', 'status');
  document.body.appendChild(t); setTimeout(() => t.remove(), 2600);
}

render();
</script>
</body>
</html>
