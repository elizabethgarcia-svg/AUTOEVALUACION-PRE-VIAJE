  if (activas.length) html += '<div class="restr" role="region" aria-label="Restricciones activas"><div class="franja-roja"></div><div class="restr-cab">' + senalSVG('prohibido', 'camion') + '<div><b>' + activas.length + (activas.length === 1 ? ' restricción activa' : ' restricciones activas') + ' ahora</b><span>Son las ' + fmtHora24(ahora) + ' h. Tramos y zonas donde ahora no se circula o no se para.</span></div></div>' +
    activas.slice(0, 5).map(filaZona).join('') + (activas.length > 5 ? '<a class="restr-mas" href="#zonasRiesgo" id="lnkZonas">Ver las ' + activas.length + ' restricciones en el mapa de tramos ↓</a>' : '') + '</div>';

  html += '<div class="tarjeta pila" id="chatBox"><div class="tarjeta-titulo"><span class="ico">' + ICONO.chat + '</span><div>Asistente de ruta<div class="ayuda">Paradas, restricciones por zona u horario, reglas de cliente y a quién llamar.' + (ASISTENTE.endpoint ? '' : ' Funciona sin internet.') + '</div></div></div>' +
    '<div class="chat" id="chat" aria-live="polite">' + (estado.chat || []).map(m => '<div class="burbuja ' + m.de + '">' + esc(m.texto).replace(/\n/g, '<br>') + '</div>').join('') + '</div>' +
    '<div class="sugerencias">' + ['¿Cuál es la parada más cercana?', '¿Puedo circular por la 57 de noche?', 'Pensión para pernoctar cerca de Saltillo', '¿A quién llamo si me detiene la autoridad?', 'Reglas de Bafar'].map(s => '<button type="button" class="chip-sug" data-sug="' + esc(s) + '">' + esc(s) + '</button>').join('') + '</div>' +
    '<form class="chat-form" id="chatForm"><label class="sr" for="chatInput">Pregunta</label><input id="chatInput" placeholder="' + (nombreOperador() ? nombreOperador() + ', ¿' : '¿') + 'dónde puedo parar cerca de…?" autocomplete="off"><button class="btn primario" id="btnPreguntar" type="submit" style="width:auto">' + ICONO.check + '<span class="sr">Preguntar</span></button></form>' +
    '</div>';

  // Escalamiento · letrero de auxilio en carretera
  if (c.escalamiento.length) html += '<div class="auxilio" role="region" aria-label="Auxilio en carretera"><div class="auxilio-cab"><span class="sos" aria-hidden="true">SOS</span><div><b>Auxilio en carretera</b><span>Llama en este orden. Si no contesta un nivel, pasa al siguiente.</span></div></div>' +
    c.escalamiento.map(e => '<a class="caseta" href="tel:' + esc(e.tel.replace(/\s/g, '')) + '"><span class="caseta-n">' + e.nivel + '</span><div class="caseta-txt"><b>' + esc(e.rol) + '</b><span class="caseta-tel">' + esc(e.tel) + '</span><span>' + esc(e.cuando) + '</span></div>' + ICONO.telefono + '</a>').join('') + '</div>';

  // Paradas · filtros como señales
  const escudoRegion = (v, l, sub) => '<button type="button" class="chip-escudo" aria-pressed="' + (region === v ? 'true' : 'false') + '" data-region="' + v + '"><svg viewBox="0 0 72 58" aria-hidden="true" preserveAspectRatio="none"><path d="M3 3h66v30c0 13-15 20-33 23C18 53 3 46 3 33z" fill="#FFFFFF" stroke="#0B1B3F" stroke-width="2.5"/></svg><small>' + sub + '</small><span>' + l + '</span></button>';
  html += '<div class="filtros">' + [['todas', 'Todas', ''], ['pensión', 'Pensiones', 'cama'], ['parador', 'Paradores', 'comida'], ['gasolinera', 'Gasolineras', 'gasolina'], ['patio', 'Patios', 'camion'], ['cliente', 'Clientes', 'bandera']].map(([v, l, i]) => '<button type="button" class="chip-filtro" aria-pressed="' + (filtro === v ? 'true' : 'false') + '" data-filtro="' + v + '">' + (i ? ICONO[i] : '') + l + '</button>').join('') + '</div>' +
    '<div class="filtros-escudo" role="group" aria-label="Región">' + escudoRegion('todas', 'MX', 'República') + escudoRegion('Norte', 'Norte', 'Región') + escudoRegion('Centro', 'Centro', 'Región') + escudoRegion('Sur', 'Sur', 'Región') +
    (marcadas.size ? '<button type="button" class="chip-filtro" id="btnTodasParadas">Ver todas</button>' : '') + '</div>' +
    '<div class="ayuda">' + (pos ? 'Ordenadas por distancia desde tu posición.' : 'Comparte tu ubicación en el tramo de identificación para ordenarlas por distancia.') + ' ' + items.length + ' parada' + (items.length === 1 ? '' : 's') + '.</div>';
  html += '<div class="pila" id="listaParadas">' + (mostrar.length ? mostrar.map(tarjetaParada).join('') : '<div class="aviso info">' + ICONO.info + '<div>No hay paradas con ese filtro.</div></div>') +
    (!marcadas.size && items.length > mostrar.length ? '<button class="btn fantasma" id="btnVerMas" type="button">Ver las ' + items.length + ' paradas</button>' : '') + '</div>';

  // Zonas de riesgo · mapa de tramos sobre la carretera
  const zonasOrden = [...c.zonas].sort((a, b) => (zonaActiva(b, ahora) ? 1 : 0) - (zonaActiva(a, ahora) ? 1 : 0));
  html += '<details class="bloque" id="zonasRiesgo"' + (activas.length ? ' open' : '') + '><summary>' + ICONO.alerta + ' Tramos y zonas de riesgo <span class="cuenta-chip">' + c.zonas.length + '</span></summary><div class="tramos">' +
    zonasOrden.map(z => { const t = ZONA_TIPO[z.tipo] || ZONA_TIPO.detenerse, on = zonaActiva(z, ahora), sz = SENAL_ZONA[z.tipo] || SENAL_ZONA.detenerse, carr = carreteraDe(z);
      return '<div class="tramo' + (on ? ' activa' : '') + '">' + senalSVG(sz[0], sz[1]) + '<div class="tramo-txt"><b>' + esc(z.nombre) + '</b><div class="tramo-regla">' + esc(z.regla.replace(/\s*\d{1,2}:\d{2}\s*[–-]\s*\d{1,2}:\d{2}/, '').replace(/\s*·\s*todo el d[ií]a/i, '')) + (z.estados && z.estados.length ? ' · ' + esc(z.estados.join(', ')) : '') + '</div>' +
        '<div class="tramo-meta">' + (carr ? escudoHTML(carr, 'mini') : '') + '<span class="tramo-hora">' + horaCorta(z) + '</span><span class="sev ' + (t.cls === 'danger' ? 'critico' : 'riesgo') + '">' + esc(t.lab) + '</span>' + (on ? '<span class="etiqueta noapto">Activa ahora</span>' : '') + '</div></div></div>'; }).join('') + '</div></details>';

  // Prohibidos · señal de ALTO
  if (c.prohibidos.length) html += '<details class="bloque"><summary>' + ICONO.xOctagono + ' Lugares prohibidos <span class="cuenta-chip">' + c.prohibidos.length + '</span></summary><div style="margin-top:8px">' + c.prohibidos.map(p => '<div class="alto-item">' + octagonoSVG('ALTO') + '<div><b>' + esc(p.nombre) + '</b>' + (p.detalle ? '<span>' + esc(p.detalle) + '</span>' : '') + '</div></div>').join('') + '</div></details>';

  // Reglas permanentes · letreros informativos
  if (c.reglas.length) html += '<details class="bloque"><summary>' + ICONO.mano + ' Reglas permanentes <span class="cuenta-chip">' + c.reglas.length + '</span></summary><div class="pila" style="margin-top:12px">' + c.reglas.map((r, i) => '<div class="letrero-info"><span class="poste" aria-hidden="true"><b>REGLA</b><i>' + (i + 1) + '</i></span><div class="ltxt"><b>' + esc(r.titulo) + '</b><span>' + esc(r.detalle) + '</span></div></div>').join('') + '</div></details>';

  // Clientes · señal verde de destino
  if (c.clientes.length) html += '<details class="bloque"><summary>' + ICONO.camion + ' Reglas por cliente <span class="cuenta-chip">' + c.clientes.length + '</span></summary><div class="pila" style="margin-top:12px">' + c.clientes.map(cl => '<div class="guia"><div class="guia-cab"><div class="guia-txt"><b>' + esc(cl.nombre) + '</b><span>' + esc(cl.corredor) + '</span></div>' + ICONO.curva + '</div><ul class="lista-reglas">' + cl.reglas.map(r => '<li>' + esc(r) + '</li>').join('') + '</ul></div>').join('') + '</div></details>';

  html += '<div class="acciones"><button class="btn fantasma" id="btnVolverDictamen" type="button">' + ICONO.check + ' Volver al dictamen</button><button class="btn secundario" id="btnNuevaDesdeParadas" type="button">Nueva evaluación</button></div>';
  html += '</section>';
  vista.innerHTML = html;

  const enviar = async texto => {
    texto = (texto || '').trim(); if (!texto) return;
    estado.chat = estado.chat || []; estado.chat.push({ de: 'yo', texto });
    const chat = $('#chat'); chat.insertAdjacentHTML('beforeend', '<div class="burbuja yo">' + esc(texto) + '</div><div class="burbuja bot pensando" id="pensando">Buscando…</div>'); chat.scrollTop = chat.scrollHeight;
    $('#chatInput').value = '';
    const r = await responderAsistente(texto);
    estado.chat.push({ de: 'bot', texto: r.texto }); estado.paradasMarcadas = r.ids;
    renderParadas();
    const c2 = $('#chat'); c2.scrollTop = c2.scrollHeight;
    if (r.ids.length) { const el = $('#pa-' + r.ids[0]); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' }); }
  };
  $('#chatForm').addEventListener('submit', e => { e.preventDefault(); enviar($('#chatInput').value); });
  vista.querySelectorAll('.chip-sug').forEach(b => b.addEventListener('click', () => enviar(b.dataset.sug)));
  vista.querySelectorAll('.chip-filtro[data-filtro]').forEach(b => b.addEventListener('click', () => { estado.filtroParadas = b.dataset.filtro; estado.paradasMarcadas = []; renderParadas(); }));
  vista.querySelectorAll('[data-region]').forEach(b => b.addEventListener('click', () => { estado.filtroRegion = b.dataset.region; estado.paradasMarcadas = []; renderParadas(); }));
  const lz = $('#lnkZonas'); if (lz) lz.addEventListener('click', e => { e.preventDefault(); const d = $('#zonasRiesgo'); d.open = true; d.scrollIntoView({ behavior: 'smooth', block: 'start' }); });
  const bt = $('#btnTodasParadas'); if (bt) bt.addEventListener('click', () => { estado.paradasMarcadas = []; renderParadas(); });
  const bm = $('#btnVerMas'); if (bm) bm.addEventListener('click', () => { estado.verMasParadas = true; renderParadas(); });
  $('#btnVolverDictamen').addEventListener('click', () => { estado.paso = SECCIONES.length; render(); });
  $('#btnNuevaDesdeParadas').addEventListener('click', nuevaEvaluacion);
  const chat = $('#chat'); if (chat) chat.scrollTop = chat.scrollHeight;
}

function htmlEstadoNube() {
  const e = estado.resultado.nube;
  if (e === 'ok') return '<div class="aviso ok">' + ICONO.checkCirculo + '<div><b>Guardado en el registro de Cabina</b>El dictamen, la foto y la imagen ya están en la base de datos.</div></div>';
  if (e === 'pendiente') return '<div class="aviso warn">' + ICONO.alerta + '<div><b>Sin señal: guardado pendiente</b>El dictamen quedó en el teléfono y se enviará solo al recuperar señal. Mientras tanto, envíelo por WhatsApp.</div></div>';
  return '<div class="aviso info"><span class="spinner" aria-hidden="true" style="width:18px;height:18px;border-width:2px"></span><div><b>Guardando en el registro de Cabina…</b></div></div>';
}
function pintarEstadoNube() { const c = $('#estadoNube'); if (c) c.innerHTML = htmlEstadoNube(); }
function renderResultado() {
  const r = estado.resultado, d = estado.datos;
  let html = '<section class="etapa pila-24">';
  html += '<div class="letrero ' + (r.apto ? 'apto' : 'noapto') + '" role="status"><div class="ojal">Dictamen pre-viaje</div><span class="senal">' + (r.apto ? 'Siga' : 'Alto') + '</span><h2>' + (r.apto ? ICONO.checkCirculo + 'Apto' : ICONO.xOctagono + 'No apto') + '</h2>' +
    '<p>' + (r.apto ? 'Puede iniciar el viaje. Buen camino, ' + esc(d.nombre.split(' ')[0]) + '.' : 'No salga. Repórtese con Cabina de Seguridad.') + '</p>' +
    '<div class="folio">Folio ' + esc(r.folio) + '</div></div>';
  if (r.pendienteValidacion) html += '<div class="aviso warn">' + ICONO.alerta + '<div><b>Pendiente de validación</b>Las horas de conducción se declararon sin GPS. Cabina debe validar antes de autorizar la salida.</div></div>';
  if (r.nube) html += '<div id="estadoNube">' + htmlEstadoNube() + '</div>';
  html += '<div class="tarjeta identidad">' + (estado.foto ? '<img class="foto-mini grande" src="' + estado.foto + '" alt="Foto del operador">' : '<div class="foto-mini grande vacia">' + ICONO.usuario + '</div>') + '<div class="identidad-txt"><b>' + esc(d.nombre) + '</b><span>Unidad ' + esc(d.economico) + ' · ' + esc(d.ruta) + '</span><span>' + esc(fmtFechaHora(d.fecha)) + '</span><span>' + (estado.ubicacion ? ICONO.pin + ' ' + estado.ubicacion.lat.toFixed(5) + ', ' + estado.ubicacion.lon.toFixed(5) : ICONO.gps + ' ' + esc(estado.gps.ubicacion)) + '</span><span>' + ICONO.checkCirculo + ' Compromiso aceptado</span></div></div>';

  html += '<div class="tarjeta"><div class="ojal">' + (r.factores.length ? 'Factores detectados' : 'Sin factores de riesgo') + '</div>';
  if (r.factores.length) {
    html += '<ul class="factores">' + r.factores.map(x => '<li><span class="sev ' + x.sev + '">' + (x.sev === 'critico' ? ICONO.xOctagono + 'Crítico' : ICONO.alerta + 'Riesgo') + '</span><span>' + esc(x.t) + '</span></li>').join('') + '</ul>' +
      '<p class="texto-2" style="margin-top:12px">Un factor crítico vuelve NO APTO por sí solo. Los puntos de riesgo suman ' + r.puntos + ' de ' + REGLAS.puntosNoApto + ' necesarios para NO APTO.</p>';
  } else html += '<p class="texto-2" style="margin-top:4px">Descanso en regla, sin malestares, unidad revisada y documentos completos.</p>';
  html += '</div>';

  if (!r.apto && r.reintentoHoras) {
    const hasta = new Date(new Date(d.fecha).getTime() + r.reintentoHoras * 3600e3);
    html += '<div class="estado-card bloqueo"><div class="franja-alto" aria-hidden="true"></div><div class="estado-cuerpo"><div><div class="ojal" style="color:var(--danger-text)">' + esc(r.reintentoMotivo) + '</div><h2>' + ICONO.reloj + 'Vuelva a hacer la evaluación en ' + r.reintentoHoras + ' h</h2></div>' +
      '<div class="cuenta"><div class="k">Descanse y repita la prueba a partir de las</div><div class="reloj">' + fmtHora24(hasta) + '<small style="font-size:22px;color:rgba(255,255,255,.8)"> h</small></div><div class="h">' + (hasta.getDate() !== new Date(d.fecha).getDate() ? 'de mañana · ' : '') + 'Duerma o repose en un lugar seguro. No salga antes.</div></div></div></div>';
  }
  if (r.mtto.length) {
    html += '<div class="tarjeta pila" style="gap:8px"><div class="tarjeta-titulo"><span class="ico">' + ICONO.llave + '</span><div>Folio de Mantenimiento <b>' + esc(r.folioMtto) + '</b><div class="ayuda">Se envía junto con el dictamen para su atención.</div></div></div>' +
      '<ul class="factores">' + r.mtto.map(x => '<li><span class="sev ' + (x.bloquea ? 'critico' : 'riesgo') + '">' + (x.bloquea ? ICONO.xOctagono + 'No sale' : ICONO.info + 'Atender') + '</span><span>' + esc(x.t) + '</span></li>').join('') + '</ul></div>';
  }
  if (r.reinstruccion.length) {
    html += '<div class="tarjeta pila" style="gap:8px"><div class="tarjeta-titulo"><span class="ico">' + ICONO.mano + '</span><div>Reinstrucción antes de salir<div class="ayuda">Cabina de Seguridad debe explicar estas reglas al operador.</div></div></div>' +
      '<ul class="factores">' + r.reinstruccion.map(x => '<li><span class="sev riesgo">' + ICONO.alerta + 'Regla</span><span>' + esc(x.charAt(0).toUpperCase() + x.slice(1)) + '</span></li>').join('') + '</ul></div>';
  }
  if (!r.apto) html += '<div class="aviso info">' + ICONO.info + '<div><b>¿Qué sigue?</b>Cabina de Seguridad recibe este dictamen. Si el motivo es descanso o salud, se reprograma la salida. Si es la unidad, se levanta reporte a Mantenimiento. Esto no es una sanción: es la decisión correcta.</div></div>';

  if (r.imagen) html += '<div class="tarjeta pila" style="gap:8px"><div class="ojal">Imagen del dictamen</div><img class="dictamen-img" src="' + r.imagen + '" alt="Dictamen en imagen para enviar a Cabina"><div class="ayuda">Esta imagen es la que se envía a Cabina. También puede mantenerla presionada para guardarla.</div></div>';
  if (r.apto) html += '<div class="estado-card permiso"><div class="franja-ok" aria-hidden="true"></div><div class="estado-cuerpo"><div><div class="ojal" style="color:var(--ok-text)">Siguiente paso</div><h2>' + ICONO.parking + 'Paradas y restricciones</h2></div><p class="texto-2">Envíe el dictamen a Cabina y consulte paradas autorizadas, zonas con restricción de horario, lugares prohibidos y a quién llamar. El asistente responde preguntas de su ruta.</p><button class="btn primario" id="btnParadas" type="button">' + ICONO.parking + ' Ver paradas autorizadas</button></div></div>';
  html += '<div class="acciones">' +
    (r.imagen ? '<button class="btn ok" id="btnWaImg" type="button">' + ICONO.wa + ' Enviar imagen a Cabina por WhatsApp</button>' : '') +
    '<a class="btn ' + (r.imagen ? 'fantasma' : 'ok') + '" id="btnWa" href="https://wa.me/' + WHATSAPP_CABINA + '?text=' + encodeURIComponent(textoResumen()) + '" target="_blank" rel="noopener">' + ICONO.wa + ' Enviar en texto por WhatsApp</a><div class="ayuda" style="text-align:center">Se envía al 444 149 2690 (Cabina de Seguridad)</div>' +
    '<button class="btn fantasma" id="btnCopiar" type="button">' + ICONO.copiar + ' <span id="btnCopiarTxt">Copiar resumen</span></button>' +
    '<button class="btn secundario" id="btnNueva" type="button">Nueva evaluación</button></div>';
  html += renderHistorialCorto();
  html += '</section>';
  vista.innerHTML = html;

  const bImg = $('#btnWaImg'); if (bImg) bImg.addEventListener('click', async () => { await compartirImagenDictamen(); if (r.apto) setTimeout(() => { if (estado.paso === SECCIONES.length) { estado.paso = 'paradas'; render(); toast('Dictamen enviado. Estas son sus paradas autorizadas.'); } }, 1500); });
  $('#btnWa').addEventListener('click', () => { if (r.apto) setTimeout(() => { if (estado.paso === SECCIONES.length) { estado.paso = 'paradas'; render(); } }, 1500); });
  $('#btnCopiar').addEventListener('click', async () => {
    try { await navigator.clipboard.writeText(textoResumen()); $('#btnCopiarTxt').textContent = 'Resumen copiado'; toast('Resumen copiado.'); setTimeout(() => { const t = $('#btnCopiarTxt'); if (t) t.textContent = 'Copiar resumen'; }, 2500); }
    catch (e) { toast('No se pudo copiar automáticamente. Use el botón de WhatsApp.'); }
  });
  $('#btnNueva').addEventListener('click', nuevaEvaluacion);
  const bPar = $('#btnParadas'); if (bPar) bPar.addEventListener('click', () => { estado.paso = 'paradas'; render(); });
}
function nuevaEvaluacion() {
  Object.assign(estado, { paso: -1, gps: null, respuestas: {}, firma: false, firmaTexto: '', firmaImg: null, acepta: false, compromiso: false, foto: null, ubicacion: null, ubicacionEstado: 'pendiente', vision: null, reaccion: null, chat: [], paradasMarcadas: [], filtroParadas: 'todas', filtroRegion: 'todas', verMasParadas: false, mostrarErrores: false, resultado: null, datos: { nombre: estado.datos.nombre, economico: estado.datos.economico, fecha: '', ruta: '' } });
  render();
}

function renderHistorialCorto() {
  let h = [];
  try { h = JSON.parse(localStorage.getItem('previaje.historial') || '[]'); } catch (e) {}
  if (!h.length) return '';
  return '<div class="tarjeta historial"><div class="ojal">Últimas evaluaciones en este teléfono</div><ul>' +
    h.slice(0, 5).map(x => '<li><span>' + esc(fmtFechaHora(x.fecha)) + ' · ' + esc(x.economico) + ' · ' + esc(x.nombre.split(' ')[0]) + '</span><span class="etiqueta ' + (x.apto ? 'apto' : 'noapto') + '">' + (x.apto ? ICONO.check + 'Apto' : ICONO.x + 'No apto') + '</span></li>').join('') + '</ul></div>';
}

function toast(msg) {
  const t = document.createElement('div'); t.className = 'aviso-toast'; t.textContent = msg; t.setAttribute('role', 'status'); t.setAttribute('aria-live', 'polite');
  document.body.appendChild(t); setTimeout(() => t.remove(), 3000);
}

try { const ps = JSON.parse(localStorage.getItem('previaje.paradas') || 'null'); if (Array.isArray(ps) && ps.length) estado.paradas = ps; } catch (e) {}
if (nube.activa() && nube.cargarSesion()) nube.vaciarCola();
render();

/* Instalación como app (PWA): registra el service worker solo cuando se sirve por HTTPS o localhost */
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  window.addEventListener('load', () => { navigator.serviceWorker.register('./sw.js').catch(() => {}); });
}
/* Aviso de instalación en Android (Chrome): guarda el evento y muestra el botón en la pantalla de inicio */
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); eventoInstalar = e; const b = document.getElementById('btnInstalar'); if (b) b.hidden = false; });
document.addEventListener('click', async e => {
  const b = e.target.closest('#btnInstalar'); if (!b || !eventoInstalar) return;
  eventoInstalar.prompt(); const r = await eventoInstalar.userChoice; eventoInstalar = null; b.hidden = true;
  if (r && r.outcome === 'accepted') toast('Pre-Viaje quedó instalada en su teléfono.');
});
</script>
