<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:O;font-weight:900;src:url(fonts/overpass-latin-900-normal.woff2)}
@font-face{font-family:M;font-weight:800;src:url(fonts/montserrat-latin-800-normal.woff2)}
@font-face{font-family:M;font-weight:900;src:url(fonts/montserrat-latin-900-normal.woff2)}
@page{size:letter landscape;margin:0}
body{margin:0}
.p{width:1056px;height:816px;position:relative;page-break-after:always;overflow:hidden;background:#fff}
.p svg{position:absolute;left:0;top:0}
.pie{position:absolute;left:0;right:0;bottom:22px;text-align:center;font-family:M;font-weight:800;font-size:12px;letter-spacing:1px;color:#888}
</style><script src="logo.js"></script></head><body><div id="d"></div>
<script>
// Letreros para arriba de los monitores: cada uno mide 2 hojas carta horizontales (1920x672 px, ~51x18 cm).
const BW = 1920, BH = 672;
const L = [
  { t: 'ZONA DE RESTRICCIÓN', s: 'SOLO ALMAS AUTORIZADAS', bg: '#C62828', fg: '#fff', sc: '#FFD54A', ic: 'prohibido' },
  { t: 'ZONA SIN COBERTURA', s: 'AQUÍ NI LOS ESPÍRITUS TIENEN SEÑAL', bg: '#1C2233', fg: '#fff', sc: '#9FD3FF', ic: 'senal' },
  { t: 'ESTATUS AL CLIENTE', s: 'EN TRÁNSITO · SIN NOVEDAD · LLEGADA A TIEMPO', bg: '#1E8E4E', fg: '#fff', sc: '#D9FFE6', ic: 'palomita' },
  { t: 'PARADA NO AUTORIZADA', s: 'NI PARA EL CAFECITO', bg: '#F6C300', fg: '#111', sc: '#111', ic: 'cafe', rayas: true },
];
function icono(tipo, x, y, l) {
  if (tipo === 'prohibido') return `<g transform="translate(${x},${y})"><circle r="150" fill="#fff"/><circle r="122" fill="#C62828"/><rect x="-92" y="-26" width="184" height="52" rx="10" fill="#fff"/></g>`;
  if (tipo === 'senal') return `<g transform="translate(${x},${y})">${[0, 1, 2, 3].map(i => `<rect x="${-110 + i * 58}" y="${80 - i * 50 - 40}" width="40" height="${40 + i * 50}" rx="8" fill="#fff" opacity="${i > 1 ? .35 : 1}"/>`).join('')}<line x1="-130" y1="-120" x2="130" y2="110" stroke="#FF4D4D" stroke-width="22" stroke-linecap="round"/></g>`;
  if (tipo === 'palomita') return `<g transform="translate(${x},${y})"><circle r="150" fill="#fff"/><path d="M-72,4 L-20,58 L84,-60" fill="none" stroke="#1E8E4E" stroke-width="38" stroke-linecap="round" stroke-linejoin="round"/></g>`;
  return `<g transform="translate(${x},${y})"><circle r="150" fill="#fff" stroke="#C62828" stroke-width="26"/>
    <path d="M-62,-20 H38 V26 C38,56 14,66 -12,66 C-38,66 -62,56 -62,26 Z" fill="#111"/><path d="M38,-6 C70,-6 70,40 38,40" fill="none" stroke="#111" stroke-width="12"/>
    ${[-40, -12, 16].map(d => `<path d="M${d},-38 C${d - 12},-56 ${d + 12},-66 ${d},-86" fill="none" stroke="#111" stroke-width="9" stroke-linecap="round"/>`).join('')}
    <line x1="-104" y1="-104" x2="104" y2="104" stroke="#C62828" stroke-width="26" stroke-linecap="round"/></g>`;
}
function letrero(l, i) {
  let rayas = '';
  if (l.rayas) for (let k = -2; k < 40; k++) rayas += `<path d="M${k * 60},0 l40,0 l-60,60 l-40,0 Z M${k * 60},${BH - 60} l40,0 l-60,60 l-40,0 Z" fill="#111"/>`;
  return `<rect width="${BW}" height="${BH}" rx="30" fill="${l.bg}"/>${rayas}
    <rect x="30" y="${l.rayas ? 78 : 30}" width="${BW - 60}" height="${BH - (l.rayas ? 156 : 60)}" rx="20" fill="none" stroke="${l.fg}" stroke-width="10"/>
    ${icono(l.ic, 250, 320, l)}
    <text x="1130" y="380" text-anchor="middle" font-family="O" font-weight="900" font-size="170" fill="${l.fg}" data-max="1380">${l.t}</text>
    <text x="1130" y="500" text-anchor="middle" font-family="M" font-weight="900" font-size="58" fill="${l.sc}" letter-spacing="4" data-max="1340">${l.s}</text>
    <g transform="translate(1630,${l.rayas ? 538 : 560}) scale(.14)">${logoSVG('lb' + i)}</g>
    <text x="1700" y="${l.rayas ? 553 : 575}" font-family="M" font-weight="900" font-size="20" fill="${l.fg}" letter-spacing="2" opacity=".85">CENTINELA</text>`;
}
let h = '';
L.forEach((l, i) => {
  for (let mitad = 0; mitad < 2; mitad++) {
    const ox = 48 - mitad * 960;
    h += `<div class="p"><svg width="1056" height="816">
      <defs><clipPath id="c${i}${mitad}"><rect x="48" y="72" width="960" height="672"/></clipPath></defs>
      <g clip-path="url(#c${i}${mitad})"><g transform="translate(${ox},72)">${letrero(l, i * 2 + mitad)}</g></g>
      ${mitad === 0 ? `<line x1="1008" y1="40" x2="1008" y2="776" stroke="#999" stroke-width="1.5" stroke-dasharray="8 6"/><text x="1000" y="60" text-anchor="end" font-family="M" font-weight="800" font-size="13" fill="#888">✂ recorta aquí y empalma sobre la hoja 2 ▶</text>`
                    : `<path d="M48,40 V64 M48,752 V776" stroke="#111" stroke-width="2"/><text x="58" y="60" font-family="M" font-weight="800" font-size="13" fill="#888">◀ aquí empalma el borde de la hoja 1</text>`}
    </svg><div class="pie">LETRERO DE MONITOR ${'ABCD'[i]} · «${l.t}» · HOJA ${mitad + 1} DE 2 · Pégalo sobre cartón y cuélgalo con hilo nylon de la rejilla del techo, sin cinta en los monitores</div></div>`;
  }
});
if (location.search.includes('full')) h = L.map((l, i) => `<svg class="full" width="960" height="336" viewBox="0 0 ${BW} ${BH}" style="display:block">${letrero(l, 'f' + i)}</svg>`).join('');
document.getElementById('d').innerHTML = h;
document.fonts.ready.then(() => {
  document.querySelectorAll('text[data-max]').forEach(el => { const mx = +el.dataset.max, w = el.getComputedTextLength(); if (w > mx) el.setAttribute('font-size', (parseFloat(el.getAttribute('font-size')) * mx / w).toFixed(1)); });
  document.body.dataset.listo = 1;
});
</script></body></html>
