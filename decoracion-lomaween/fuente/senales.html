<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:O;font-weight:700;src:url(fonts/overpass-latin-700-normal.woff2)}
@font-face{font-family:O;font-weight:800;src:url(fonts/overpass-latin-800-normal.woff2)}
@font-face{font-family:O;font-weight:900;src:url(fonts/overpass-latin-900-normal.woff2)}
@font-face{font-family:M;font-weight:800;src:url(fonts/montserrat-latin-800-normal.woff2)}
@page{margin:0}
body{margin:0}
.p{position:relative;page-break-after:always;overflow:hidden;background:#fff}
.v{width:816px;height:1056px}.h{width:1056px;height:816px}.g{width:1632px;height:1056px}
.p svg{position:absolute;left:0;top:0}
.pie{position:absolute;left:0;right:0;bottom:14px;text-align:center;font-family:M;font-weight:800;font-size:11px;letter-spacing:1px;color:#888}
</style><script src="logo.js"></script></head><body><div id="d"></div>
<script>
// Letreros de la carretera del altar. ?o=v imprime las hojas verticales y ?o=h las horizontales.
// ?o=g imprime Destinos y Parador en grande, uno por tabloide horizontal (39 × 25 cm).
const O = new URLSearchParams(location.search).get('o') || 'v';
const corte = (d) => `<path d="${d}" fill="none" stroke="#999" stroke-width="1.5" stroke-dasharray="8 6"/>`;
const flecha = (x, y, ang, s = 1, c = '#fff') => `<g transform="translate(${x},${y}) rotate(${ang}) scale(${s})"><path d="M-46,-14 H10 V-38 L50,0 L10,38 V14 H-46 Z" fill="${c}"/></g>`;
function escudo(x, y, s, num) { // escudo de carretera federal mexicana
  return `<g transform="translate(${x},${y}) scale(${s})"><path d="M-60,-70 H60 C60,-70 64,-40 54,-30 C66,-14 70,10 56,32 C40,58 14,70 0,80 C-14,70 -40,58 -56,32 C-70,10 -66,-14 -54,-30 C-64,-40 -60,-70 -60,-70 Z" fill="#fff" stroke="#111" stroke-width="7"/>
    <text x="0" y="30" text-anchor="middle" font-family="O" font-weight="900" font-size="76" fill="#111">${num}</text></g>`;
}
const S = {
  km: () => `<svg width="816" height="1056">
      <rect x="148" y="70" width="520" height="860" rx="34" fill="#fff" stroke="#111" stroke-width="16"/>
      <rect x="176" y="98" width="464" height="804" rx="20" fill="none" stroke="#111" stroke-width="4"/>
      <text x="408" y="310" text-anchor="middle" font-family="O" font-weight="900" font-size="170" fill="#111">KM</text>
      <text x="408" y="700" text-anchor="middle" font-family="O" font-weight="900" font-size="400" fill="#111" letter-spacing="-10">57</text>
      <text x="408" y="840" text-anchor="middle" font-family="O" font-weight="800" font-size="40" fill="#111" letter-spacing="3" data-max="430">LA 57 DE LAS ÁNIMAS</text>
      ${corte('M130,52 H686 V948 H130 Z')}</svg><div class="pie">LETRERO 1 DE 6 · KILÓMETRO 57 · Recorta, pégalo sobre cartón y ponle un palito de madera</div>`,
  placaAgs: () => placa('AGUASCALIENTES', 'MÉXICO', 'CEN-877-A', '#1B2A6B', '#FF6A00', 2),
  placaSlt: () => placa('COAHUILA', 'SALTILLO', 'LOM-1028', '#0B5E33', '#E6007E', 3),
  parador: () => `<svg width="1056" height="816">
      <rect x="48" y="80" width="960" height="600" rx="34" fill="#0B4DA2"/><rect x="66" y="98" width="924" height="564" rx="22" fill="none" stroke="#fff" stroke-width="8"/>
      <text x="528" y="210" text-anchor="middle" font-family="O" font-weight="900" font-size="96" fill="#fff" letter-spacing="2" data-max="860">PARADOR CENTINELA</text>
      ${[['cafe', 190], ['comida', 410], ['cama', 630], ['gas', 850]].map(([ic, x]) => `<rect x="${x - 80}" y="260" width="160" height="160" rx="14" fill="#fff"/>${icono(ic, x, 340)}`).join('')}
      <text x="470" y="560" text-anchor="middle" font-family="O" font-weight="900" font-size="104" fill="#fff">1 km</text>${flecha(700, 526, 0, 1.3)}
      <text x="528" y="628" text-anchor="middle" font-family="O" font-weight="800" font-size="34" fill="#CFE0FF" letter-spacing="1">Descanse aquí… no en la cachimba</text>
      ${corte('M30,62 H1026 V698 H30 Z')}</svg><div class="pie">LETRERO 4 DE 6 · PARADOR CENTINELA · Recorta y pégalo sobre cartón</div>`,
  destinos: () => `<svg width="1056" height="816">
      <rect x="48" y="80" width="960" height="600" rx="34" fill="#0A6B3B"/><rect x="66" y="98" width="924" height="564" rx="22" fill="none" stroke="#fff" stroke-width="8"/>
      ${escudo(170, 220, 1.05, '57')}
      ${flecha(330, 222, -90, 1.15)}<text x="400" y="252" font-family="O" font-weight="900" font-size="90" fill="#fff" data-max="560">REGRESO A CASA</text>
      <line x1="100" y1="330" x2="956" y2="330" stroke="#fff" stroke-width="5"/>
      ${flecha(170, 422, 0, 1.0)}<text x="250" y="452" font-family="O" font-weight="900" font-size="80" fill="#fff" data-max="560">AGUASCALIENTES</text><text x="940" y="452" text-anchor="end" font-family="O" font-weight="900" font-size="80" fill="#fff">1</text>
      ${flecha(170, 562, 180, 1.0)}<text x="250" y="592" font-family="O" font-weight="900" font-size="80" fill="#fff">SALTILLO</text><text x="940" y="592" text-anchor="end" font-family="O" font-weight="900" font-size="80" fill="#fff">380</text>
      ${corte('M30,62 H1026 V698 H30 Z')}</svg><div class="pie">LETRERO 5 DE 6 · DESTINOS · Recorta y pégalo sobre cartón</div>`,
  animas: () => `<svg width="816" height="1056">
      <g transform="translate(408,400) rotate(45)"><rect x="-270" y="-270" width="540" height="540" rx="34" fill="#F6C300" stroke="#111" stroke-width="14"/><rect x="-246" y="-246" width="492" height="492" rx="22" fill="none" stroke="#111" stroke-width="5"/></g>
      ${fantasma(330, 410, 1.0)}${fantasma(480, 380, .82)}
      <path d="M250,520 H580" stroke="#111" stroke-width="10" stroke-dasharray="34 22"/>
      <rect x="128" y="790" width="560" height="190" rx="18" fill="#F6C300" stroke="#111" stroke-width="12"/>
      <text x="408" y="878" text-anchor="middle" font-family="O" font-weight="900" font-size="74" fill="#111" data-max="510">CRUCE DE ÁNIMAS</text>
      <text x="408" y="940" text-anchor="middle" font-family="O" font-weight="800" font-size="38" fill="#111" letter-spacing="2">MANEJE CON PRECAUCIÓN</text>
      ${corte('M408,0 L796,400 L408,800 L20,400 Z')}${corte('M110,772 H706 V998 H110 Z')}</svg><div class="pie">LETRERO 6 DE 6 · CRUCE DE ÁNIMAS · Recorta las dos piezas y pégalas sobre cartón, una sobre la otra</div>`,
};
function fantasma(x, y, s) {
  return `<g transform="translate(${x},${y}) scale(${s})"><path d="M-60,70 C-60,20 -64,-90 0,-90 C64,-90 60,20 60,70 L40,52 L20,72 L0,52 L-20,72 L-40,52 Z" fill="#111"/>
    <ellipse cx="-20" cy="-36" rx="11" ry="15" fill="#F6C300"/><ellipse cx="20" cy="-36" rx="11" ry="15" fill="#F6C300"/><ellipse cx="0" cy="0" rx="10" ry="13" fill="#F6C300"/></g>`;
}
function icono(tipo, x, y) {
  const c = '#0B4DA2';
  if (tipo === 'cafe') return `<g transform="translate(${x},${y})"><path d="M-44,-10 H30 V26 C30,48 14,56 -7,56 C-28,56 -44,48 -44,26 Z" fill="${c}"/><path d="M30,0 C56,0 56,34 30,34" fill="none" stroke="${c}" stroke-width="9"/><rect x="-56" y="58" width="100" height="9" rx="4" fill="${c}"/>${[-26, -6, 14].map(d => `<path d="M${d},-22 C${d - 10},-36 ${d + 10},-44 ${d},-58" fill="none" stroke="${c}" stroke-width="7" stroke-linecap="round"/>`).join('')}</g>`;
  if (tipo === 'comida') return `<g transform="translate(${x},${y})" fill="${c}"><rect x="-34" y="-60" width="10" height="120" rx="4"/><rect x="-50" y="-60" width="8" height="40" rx="3"/><rect x="-18" y="-60" width="8" height="40" rx="3"/><rect x="-50" y="-26" width="40" height="12" rx="5"/><path d="M24,-60 C52,-50 52,0 30,6 V60 H20 V-60 Z"/></g>`;
  if (tipo === 'cama') return `<g transform="translate(${x},${y})" fill="${c}"><rect x="-62" y="-6" width="124" height="34" rx="6"/><rect x="-62" y="-50" width="12" height="96" rx="4"/><rect x="52" y="0" width="12" height="46" rx="4"/><circle cx="-28" cy="-20" r="16"/><rect x="-6" y="-30" width="66" height="22" rx="10"/><text x="20" y="-46" font-family="O" font-weight="900" font-size="30">Z z</text></g>`;
  return `<g transform="translate(${x},${y})" fill="${c}"><rect x="-44" y="-56" width="60" height="112" rx="8"/><rect x="-34" y="-44" width="40" height="32" rx="4" fill="#fff"/><path d="M16,-30 H30 C40,-30 44,-24 44,-14 V34 C44,42 34,42 34,34 V0 H16" fill="none" stroke="${c}" stroke-width="8"/><rect x="-56" y="52" width="84" height="10" rx="4"/></g>`;
}
function placa(estado, sub, num, col, acento, n) {
  let papel = ''; const C = ['#7B2FF7', '#FF6A00', '#E6007E', '#22A699'];
  for (let i = 0; i < 12; i++) papel += `<path d="M${104 + i * 72},128 h60 v38 l-10,-8 l-10,8 l-10,-8 l-10,8 l-10,-8 l-10,8 Z" fill="${C[i % 4]}" opacity=".85"/>`;
  return `<svg width="1056" height="816">
    <rect x="48" y="128" width="960" height="500" rx="40" fill="#F7F7F2" stroke="#3A3D44" stroke-width="12"/>
    <rect x="70" y="150" width="916" height="456" rx="26" fill="none" stroke="${col}" stroke-width="4"/>
    ${papel.replace(/128/g, '152')}
    ${[[100, 178], [956, 178], [100, 578], [956, 578]].map(([x, y]) => `<circle cx="${x}" cy="${y}" r="13" fill="#B9BCC2" stroke="#6E7178" stroke-width="3"/>`).join('')}
    <text x="528" y="268" text-anchor="middle" font-family="O" font-weight="900" font-size="66" fill="${col}" letter-spacing="6" data-max="760">${estado}</text>
    <text x="531" y="483" text-anchor="middle" font-family="O" font-weight="900" font-size="226" fill="#000" opacity=".18" data-max="800">${num}</text>
    <text x="528" y="478" text-anchor="middle" font-family="O" font-weight="900" font-size="226" fill="${col}" data-max="800">${num}</text>
    <rect x="96" y="520" width="864" height="4" fill="${acento}"/>
    <text x="120" y="578" font-family="O" font-weight="800" font-size="40" fill="${col}" letter-spacing="3">${sub}</text>
    <text x="936" y="578" text-anchor="end" font-family="O" font-weight="800" font-size="34" fill="${acento}" letter-spacing="2">LOMAWEEN 2026</text>
    <g transform="translate(528,580) scale(.12)">${logoSVG('lp' + n)}</g>
    ${corte('M30,110 H1026 V646 H30 Z')}</svg><div class="pie">LETRERO ${n} DE 6 · PLACA DE ${estado}${sub !== 'MÉXICO' ? ' · ' + sub : ''} (de juguete) · Recorta y pégala sobre cartón</div>`;
}
const V = ['km', 'animas'], Hs = ['placaAgs', 'placaSlt', 'parador', 'destinos'];
const GRANDE = { destinos: 'LETRERO 5 DE 6 · DESTINOS', parador: 'LETRERO 4 DE 6 · PARADOR CENTINELA' };
document.getElementById('d').innerHTML = O === 'g'
  ? ['destinos', 'parador'].map(k => `<div class="p g">${S[k]().split('</svg>')[0].replace('<svg width="1056" height="816">', '<svg width="1632" height="1056" viewBox="0 39 1056 683">')}</svg>
      <div class="pie">${GRANDE[k]} · EN GRANDE: 39 × 25 CM · Imprímelo en tabloide al 100 %, recórtalo, pégalo sobre cartón y cuélgalo con nylon de la rejilla</div></div>`).join('')
  : (O === 'v' ? V : Hs).map(k => `<div class="p ${O}">${S[k]()}</div>`).join('');
document.fonts.ready.then(() => {
  document.querySelectorAll('text[data-max]').forEach(el => { const mx = +el.dataset.max, w = el.getComputedTextLength(); if (w > mx) el.setAttribute('font-size', (parseFloat(el.getAttribute('font-size')) * mx / w).toFixed(1)); });
  document.body.dataset.listo = 1;
});
</script></body></html>
