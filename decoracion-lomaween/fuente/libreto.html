<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>Libreto de los Centinelas · versión 2</title>
<style>
@font-face { font-family: M; font-weight: 700; src: url(fonts/montserrat-latin-700-normal.woff2); }
@font-face { font-family: M; font-weight: 800; src: url(fonts/montserrat-latin-800-normal.woff2); }
@font-face { font-family: M; font-weight: 900; src: url(fonts/montserrat-latin-900-normal.woff2); }
@font-face { font-family: C; font-weight: 900; src: url(fonts/cinzel-latin-900-normal.woff2); }
@font-face { font-family: Anton; src: url(fonts/anton-latin-400-normal.woff2); }
@font-face { font-family: G; src: url(fonts/gochi-hand-latin-400-normal.woff2); }
:root { --noche: #1a0e28; --naranja: #ff6a00; --oro: #ffb300; --rojo: #c62828; --morado: #7b2ff7; --tinta: #221a2c; --suave: #5d5468; --linea: #e4dfe9; --crema: #fbf6ee;
  --dice: #e85d00; --hace: #2a7f78; --canta: #b07800; --voz: #c62828; --imagen: #8a8193; }
@page { size: letter; margin: 0; }
* { box-sizing: border-box; }
body { margin: 0; font-family: Inter, sans-serif; font-size: 9.3pt; line-height: 1.38; color: var(--tinta); }
.p { width: 816px; height: 1056px; padding: 40px 46px 50px; position: relative; overflow: hidden; page-break-after: always; background: #fff; }
.p:last-child { page-break-after: auto; }
.cuerpo { height: 956px; overflow: hidden; }
.cuerpo:has(.cab) { overflow: visible; }
h2 { font-family: M; font-size: 20pt; font-weight: 900; color: var(--noche); line-height: 1.1; margin: 0 0 4px; }
h2 small { display: block; font-size: 10pt; font-weight: 700; color: var(--suave); margin-top: 4px; }
h3 { font-family: M; font-size: 9.6pt; font-weight: 800; text-transform: uppercase; letter-spacing: .06em; color: var(--naranja); margin: 14px 0 6px; }
p { margin: 0 0 6px; }
.pie { position: absolute; left: 46px; right: 46px; bottom: 20px; display: flex; justify-content: space-between; font-size: 7.5pt; color: var(--suave); border-top: 1px solid var(--linea); padding-top: 5px; }
.cab { background: var(--noche); color: #fff; margin: -40px -46px 12px; padding: 18px 46px 14px; }
.cab .eyebrow { font-family: M; font-weight: 800; font-size: 8.6pt; letter-spacing: .14em; text-transform: uppercase; color: var(--oro); }
.cab h1 { font-family: C; font-weight: 900; font-size: 28pt; line-height: 1.05; margin: 6px 0 4px; }
.cab .sub { font-family: M; font-weight: 800; font-size: 11.5pt; color: var(--naranja); }
.caja { background: var(--crema); border-radius: 10px; padding: 10px 13px; }
.cols { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
table { width: 100%; border-collapse: collapse; font-size: 8.4pt; line-height: 1.3; }
th { font-family: M; font-weight: 800; text-align: left; background: #f2ecf7; padding: 5px 6px; font-size: 7.9pt; }
td { padding: 4px 6px; border-top: 1px solid var(--linea); vertical-align: middle; }
.reparto td { padding: 2px 6px; }
td.n { font-family: M; font-weight: 900; color: var(--naranja); white-space: nowrap; }
td.al b { font-family: M; font-weight: 900; font-size: 9.2pt; display: block; color: var(--noche); }
td.al i { font-style: normal; color: var(--suave); font-size: 7.8pt; }
.raya { border-bottom: 1.4px solid #b9b0c4; height: 18px; }
.mini { display: inline-block; width: 30px; vertical-align: middle; margin-right: 6px; flex: none; }
.mini svg { display: block; width: 100%; height: auto; }
.cartas { display: flex; align-items: center; }
.cartas span { font-family: M; font-weight: 800; font-size: 8pt; line-height: 1.2; }

/* las cinco etiquetas: qué se dice y qué se actúa */
.et { display: inline-flex; align-items: center; justify-content: center; gap: 3px; min-width: 70px; font-family: M; font-weight: 900; font-size: 7.3pt; letter-spacing: .05em; color: #fff; border-radius: 12px; padding: 2px 7px; white-space: nowrap; }
.et.dice { background: var(--dice); } .et.hace { background: var(--hace); } .et.canta { background: var(--canta); } .et.voz { background: var(--voz); } .et.imagen { background: var(--imagen); }
.tx.dice { font-family: M; font-weight: 800; font-size: 9.4pt; color: var(--tinta); background: #fff4ec; border: 1.5px solid #ffc9a3; border-radius: 8px; padding: 3px 8px; }
.tx.hace { font-style: italic; color: #1e5d58; background: #eaf5f4; border-radius: 8px; padding: 3px 8px; }
.tx.canta { font-family: G; font-size: 12pt; line-height: 1.2; color: #7a4f00; background: #fff6dc; border-radius: 8px; padding: 2px 8px; }
.tx.voz { font-family: M; font-weight: 800; color: #8a1d1d; background: #fdeeee; border-radius: 8px; padding: 3px 8px; }
.tx.imagen { color: var(--suave); font-style: italic; padding: 3px 8px; }
.leyenda { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
.leyenda div { border-radius: 10px; padding: 8px 9px; background: var(--crema); font-size: 8.1pt; line-height: 1.3; }
.leyenda .et { margin-bottom: 5px; }
.ejemplo { display: grid; grid-template-columns: 84px 1fr; gap: 5px 8px; align-items: center; margin-top: 8px; }

/* el guion escena por escena */
.esc { display: flex; align-items: baseline; gap: 10px; background: var(--noche); color: #fff; border-radius: 9px; padding: 6px 12px; margin: 10px 0 6px; font-family: M; font-weight: 900; font-size: 10.5pt; }
.esc span { color: var(--oro); }
.esc i { font-style: normal; font-family: Inter; font-weight: 600; font-size: 8.2pt; color: #d9cfe8; margin-left: auto; }
.grupo { border: 1.5px solid var(--linea); border-radius: 10px; padding: 3px 9px; margin-bottom: 6px; }
.grupo .gt { display: flex; align-items: baseline; gap: 8px; font-family: M; font-weight: 900; font-size: 9.6pt; color: var(--noche); padding: 2px 0 3px; border-bottom: 1px solid var(--linea); margin-bottom: 2px; }
.grupo .gt b { color: var(--naranja); }
.grupo .gt i { font-style: normal; font-family: Inter; font-weight: 600; font-size: 7.8pt; color: var(--suave); margin-left: auto; }
.ln { display: grid; grid-template-columns: 128px 80px 1fr; gap: 8px; align-items: start; padding: 2px 0; }
.ln .q { font-family: M; font-weight: 900; font-size: 8.2pt; color: var(--noche); line-height: 1.25; padding-top: 3px; }
.ln .et { margin-top: 2px; }

/* cómo se canta */
.canto-g { font-family: G; font-size: 16pt; line-height: 1.15; color: #7a4f00; }
.canto-g .nom { font-family: Anton; font-size: 17pt; color: var(--noche); letter-spacing: .02em; }
.canto-g .pa { font-family: M; font-weight: 900; font-size: 8pt; color: #fff; background: #b07800; border-radius: 9px; padding: 1px 6px; vertical-align: middle; }
.pasos { counter-reset: p; margin: 0; padding: 0; list-style: none; }
.pasos li { counter-increment: p; position: relative; padding-left: 30px; margin-bottom: 7px; line-height: 1.36; }
.pasos li::before { content: counter(p); position: absolute; left: 0; top: 0; width: 21px; height: 21px; border-radius: 50%; background: var(--naranja); color: #fff; font-family: M; font-weight: 900; font-size: 9pt; display: flex; align-items: center; justify-content: center; }
.dibujos { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.dibujos figure { margin: 0; }
.dibujos figcaption { font-size: 7.8pt; color: var(--suave); margin-top: 3px; line-height: 1.25; }
.dibujos svg { display: block; width: 100%; height: auto; border-radius: 8px; }
.especial { border-left: 5px solid var(--c, var(--naranja)); background: var(--crema); border-radius: 0 10px 10px 0; padding: 8px 12px; margin-bottom: 8px; font-size: 8.8pt; line-height: 1.34; }
.especial b.t { font-family: M; font-weight: 900; color: var(--noche); }

/* las hojas recortables */
.hoja + .hoja { margin-top: 12px; }
.hoja .dos { display: grid; grid-template-columns: .8fr 1.2fr; gap: 14px; }
.hoja { border: 2px dashed #b9b0c4; border-radius: 12px; padding: 10px 12px 16px; position: relative; overflow: hidden; font-size: 8.1pt; line-height: 1.28; }
.hoja .top { display: flex; gap: 10px; align-items: flex-start; margin-bottom: 4px; }
.hoja .top .ttl { flex: 1; }
.hoja .top b { display: block; font-family: M; font-weight: 900; font-size: 13pt; color: var(--noche); line-height: 1.05; }
.hoja .top i { font-style: normal; font-size: 8pt; color: var(--suave); }
.hoja .top .nom { display: flex; align-items: flex-end; gap: 4px; font-size: 7.6pt; color: var(--suave); margin-top: 5px; }
.hoja .top .nom div { flex: 1; border-bottom: 1.3px solid #b9b0c4; height: 14px; }
.hoja .tc { display: flex; gap: 3px; }
.hoja .tc .mini { width: 40px; margin: 0; }
.hoja h5 { font-family: M; font-weight: 900; font-size: 7.9pt; letter-spacing: .07em; text-transform: uppercase; margin: 6px 0 3px; color: var(--naranja); }
.hoja h5.mi { color: var(--morado); }
.hoja .pz { display: grid; grid-template-columns: 34px 1fr; gap: 3px 6px; align-items: start; }
.hoja .pz .t { font-family: M; font-weight: 900; font-size: 7.6pt; color: var(--suave); padding-top: 2px; }
.hoja .pz .l { display: flex; flex-direction: column; gap: 2px; }
.hoja .pz .r { display: grid; grid-template-columns: 76px 1fr; gap: 5px; align-items: start; }
.hoja .et { min-width: 74px; font-size: 6.4pt; padding: 1px 5px; margin-top: 1px; }
.hoja .tx.dice { font-size: 8.4pt; padding: 1px 6px; } .hoja .tx.hace, .hoja .tx.voz, .hoja .tx.canta { padding: 1px 6px; }
.hoja .tx.canta { font-size: 10.5pt; }
.cuerpo > div > .hoja { margin-bottom: 12px; }
.tij { position: absolute; right: 10px; bottom: 4px; font-size: 7pt; color: #b9b0c4; }
</style>
<script src="loteria.js"></script><script src="dibujos_grabar.js"></script></head><body>
<div id="raiz"></div>
<script>
// ---------- los datos: una sola fuente para todo el libreto ----------
const CARTA = Object.fromEntries(CARTAS.map(c => [c.n, c]));
// el verso de cada carta: «/» respira, «…» alarga la voz
const VERSO = {
  1: 'Si uno se detiene… / se detienen todos…', 2: 'A tiempo, completos… / y sin un rasguño…', 3: 'Lo que se hace con el corazón… / se nota en los detalles…',
  4: 'Cruza el techo… / como las rutas del mapa…', 5: 'Nunca deja sola… / a su caja…', 6: 'Por ella se va… / y por ella se regresa…',
  7: 'Alumbra el camino… / de los que se adelantaron…', 8: 'Tiene ojos, voz… / y corazón…', 9: 'Mandarina, pan… / y cacahuate…',
  10: 'Muy elegante y bien peinada… / pero en carretera ni la invitamos…',
};
const NOM = { 1: 'El Trabajo en Equipo', 2: 'El Resultado', 3: 'La Pasión', 4: 'El Papel Picado', 5: 'El Tracto', 6: 'La Carretera', 7: 'La Cruz', 8: 'El 877', 9: 'La Ofrenda', 10: 'La Catrina' };
const VALOR = { 1: 'Trabajo en Equipo', 2: 'Enfoque a Resultados', 3: 'Pasión' };
const verso = n => `«${VERSO[n]}»`;
// lo que explica cada carta, cuándo y dónde
const EXPLICA = {
  1: { t: 'T14', cuando: 'martes 13:00', donde: 'Frente al altar, de pecho, con su carta en la mano.', idea: 'El valor Trabajo en Equipo: integrarnos, colaborar e incluir a todos.',
    dice: '«En Grupo Loma, trabajo en equipo es integrarnos, colaborar e incluir a todos. En la cabina lo vivimos cada turno: Centinelas de Ruta monitorea, Centinelas de Seguridad cuida y Rescates Carreteros sale al camino. Si uno se detiene, se detiene la unidad. Así armamos este altar: los tres equipos y los dos turnos, cada quien con su misión. Nadie se quedó fuera.»' },
  2: { t: 'T21', cuando: 'miércoles 10:45', donde: 'Frente al altar terminado, de pecho, con su carta en la mano.', idea: 'El valor Enfoque a Resultados: cumplir a tiempo, bien hecho y dentro de nuestro espacio.',
    dice: '«Enfoque a Resultados es cumplir lo que prometemos, a tiempo y bien hecho. En la ruta, el resultado es que la carga llegue completa y a tiempo, y que el operador regrese con bien a su casa. Aquí lo medimos igual: empezamos el 19, terminamos un día antes, todo dentro de nuestro espacio y sin un solo clavo ni un pedazo de cinta. Llegamos a destino, completos y sin un rasguño.»' },
  3: { t: 'T31', cuando: 'miércoles 11:30', donde: 'Frente al altar, de pecho, con su carta en la mano.', idea: 'El valor Pasión: creatividad, entusiasmo y corazón en cada detalle.',
    dice: '«Pasión es poner creatividad, entusiasmo y corazón en cada detalle. En la cabina es llamar a un operador en la madrugada solo para preguntarle: “¿Cómo vas, compañero?”. Con esa misma pasión hicimos todo a mano: el tracto, la carretera, el panteón, la ofrenda… y al 877, para llegar al corazón del operador… desde su casa.»' },
  4: { t: 'T23', cuando: 'miércoles 9:00', donde: 'Señala el papel picado del techo. Lo graban desde abajo.', idea: 'Las rutas que seguimos en el mapa, de día y de noche.',
    dice: '«El papel picado cruza el techo de pared a pared, como las rutas que seguimos en el mapa. Cada tira es una ruta, y cada color, una unidad en camino. Desde aquí las vemos todas, de día y de noche, hasta que llegan.»' },
  5: { t: 'T24', cuando: 'miércoles 9:00', donde: 'A un lado del altar, lo presenta con la mano. Después, de cerca, la parrilla y la calavera.', idea: 'Nunca dejamos sola a una unidad: el altar es un tracto.',
    dice: '«Un tracto nunca deja sola a su caja, y nosotros nunca dejamos sola a una unidad. Por eso nuestro altar es un tracto: la parrilla con el 877, los faros que alumbran el camino y la calavera que nos recuerda a los que ya no están. Eso cuidamos: cada unidad que sale y cada operador que regresa.»' },
  6: { t: 'T25', cuando: 'miércoles 9:00', donde: 'Agachada junto al mantel, señala la carretera. Después, de cerca, los tractos de izquierda a derecha.', idea: 'Cada tramo tiene sus riesgos; la cuidamos kilómetro por kilómetro.',
    dice: '«La carretera es nuestro lugar de trabajo, aunque nunca salgamos de la cabina. En el mantel va con sus tractos y sus señalamientos: el KM 57, Aguascalientes, Saltillo… Cada tramo tiene sus riesgos: curvas, zonas sin señal, cansancio. Por eso la cuidamos kilómetro por kilómetro: por ella se va, y por ella se tiene que regresar.»' },
  7: { t: 'T26', cuando: 'miércoles 9:00', donde: 'De pie junto a la cruz de sal. Después, desde arriba, la cruz y los pétalos.', idea: 'Las cruces del camino y para qué está Rescates.',
    dice: '«En la carretera, una cruz a la orilla del camino recuerda a alguien que no llegó. Nuestra cruz de sal purifica el camino, y el cempasúchil y las velas guían de regreso a los que se nos adelantaron. Y nos recuerda para qué está Rescates: para salir de inmediato cuando alguien nos necesita en el camino.»' },
  8: { t: 'T28', cuando: 'miércoles 9:00', donde: 'Junto a la tele, con el 877 en pantalla.', idea: 'Detrás de cada unidad hay un operador y una familia que lo espera.',
    dice: '«El 877 es un tracto como los que cuidamos todos los días, pero este tiene ojos, voz y corazón. Hicimos su video con nuestra propia voz, para que los niños sepan qué hacemos aquí: que detrás de cada punto en el mapa hay un operador, y una familia que lo espera en casa.»' },
  9: { t: 'T29', cuando: 'miércoles 9:00', donde: 'Junto a un escritorio con su ofrenda. Después, de cerca, la ofrenda.', idea: 'Una parada en el camino para los que están lejos de casa.',
    dice: '«Un operador pasa días lejos de casa, y lo que más extraña es la mesa de su familia. Por eso en cada escritorio pusimos una ofrenda, como una parada en el camino: el sarape de México, mandarinas, cacahuates, pan de muerto, velas y flores. Para los que se adelantaron… y para los que siguen en ruta.»' },
  10: { t: 'T27', cuando: 'miércoles 9:00', donde: 'Entre las lápidas del panteón. Después, de cerca, las 8 lápidas.', idea: 'Los malos hábitos de la ruta se quedan enterrados.',
    dice: '«La Catrina es muy elegante, pero en carretera no la queremos ni de copiloto. Ella es la reina de este panteón, donde enterramos los malos hábitos que la cabina detecta en la ruta: el exceso de velocidad, el celular al volante, la fatiga, el cinturón sin abrochar… y el desvío de ruta, que ese lo cazo yo. Aquí se quedan, y no regresan.»' },
};
const MONITORES = '«Arriba de cada monitor va un letrero de carretera, y cada uno es una alerta que atendemos todos los días: zona de restricción, zona sin cobertura, estatus al cliente, parada no autorizada. Así se vive la ruta desde la cabina.»';
const DIFICILES = '«En la cabina también hemos vivido días difíciles. Días que nos enseñaron a reinventarnos, todos los días. Por eso nació el 877: para hacer equipo desde casa, porque ahí empieza la prevención.»';
const C = [
  { a: 'La Base', rol: 'coordina el turno', t: 'T02', cartas: [], color: '#c62828' },
  { a: 'Ojo de Halcón', rol: 'monitorea las unidades', t: 'T03', cartas: [1, 4], pose: 'Hace binoculares con las manos' },
  { a: 'La de las Alertas', rol: 'exceso de velocidad y fatiga', t: 'T04', cartas: [6], pose: 'Señala a la cámara con cara de «¡ni lo pienses!»' },
  { a: 'El Rescatista', rol: 'coordina el rescate carretero', t: 'T05', cartas: [7], pose: 'Carga una lápida como si la rescatara' },
  { a: 'Caza Jammers', rol: 'jammers y desvíos de ruta', t: 'T06', cartas: [10], pose: 'Se baja los lentes oscuros, despacio' },
  { a: 'La Voz', rol: 'la voz del 877', t: 'T07', cartas: [8], pose: 'Usa el celular como micrófono' },
  { a: 'El de la Llamada', rol: 'llama a los operadores', t: 'T08', cartas: [3], pose: 'Teléfono al oído y guiño' },
  { a: 'La Arquitecta', rol: 'armó el altar', t: 'T09', cartas: [5], pose: 'Presume el tracto de atrás con las dos manos' },
  { a: 'Manos de Cempasúchil', rol: 'la ofrenda y las flores', t: 'T10', cartas: [9], pose: 'Avienta pétalos al aire, sobre la cartulina para no ensuciar' },
  { a: 'El Turno de la Noche', rol: 'el turno nocturno', t: 'T11', cartas: [2], pose: 'Brinda con su taza' },
];
// la lotería: cada Centinela recibe su carta, la canta y dice «¡Me tocó…!»
C[0].loteria = [['hace', 'Sale con la baraja en las manos y la abre en abanico hacia la cámara.'], ['dice', '«Aquí Base Centinela: tenemos una misión… y no es de monitoreo.»'], ['hace', 'Se pone los audífonos, voltea a la cámara y se queda 3 segundos sin moverse.']];
C.slice(1).forEach(c => {
  const [n1, n2] = c.cartas;
  c.loteria = [['hace', 'Recibe la carta que entra por la derecha y la voltea hacia la cámara, a la altura del pecho.'], ['canta', verso(n1)], ['dice', `«¡Me tocó ${NOM[n1]}!»`]];
  if (n2) c.loteria.push(['hace', 'Entra una segunda carta. La voltea y enseña las dos en abanico.'], ['canta', verso(n2)], ['dice', `«¡Y también ${NOM[n2]}!»`]);
  c.loteria.push(['hace', `${c.pose}, y se queda 3 segundos sin moverse, como foto.`]);
});
// todas las tomas de cada quien, con lo que hace y lo que dice
const tomaCarta = n => [EXPLICA[n].t, [['hace', EXPLICA[n].donde], ['dice', EXPLICA[n].dice]], EXPLICA[n].cuando];
const porA = a => C.find(c => c.a === a);
porA('La Base').mas = [['T12', [['hace', 'Baraja la lotería sobre el sarape y reparte las cartas boca abajo, una por una. Solo salen sus manos, grabadas desde arriba. Sin hablar.']], 'martes 10:45'],
  ['T13', [['voz', 'Las 7 llamadas de radio, con la grabadora del celular. No sale a cuadro.']], 'martes 10:45']];
porA('Ojo de Halcón').mas = [tomaCarta(1), tomaCarta(4)];
porA('La de las Alertas').mas = [['T15', [['hace', 'En su lugar de trabajo, de pecho, mirando a la lente.'], ['dice', '«Ningún viaje se hace solo: aquí todos jalamos parejo.»']], 'martes 13:00'], tomaCarta(6),
  ['T30', [['hace', 'Bajo los letreros de los monitores, los señala. Sin pantallas con datos a la vista.'], ['dice', MONITORES]], 'miércoles 9:00']];
porA('El Rescatista').mas = [tomaCarta(7)];
porA('Caza Jammers').mas = [tomaCarta(10)];
porA('La Voz').mas = [tomaCarta(8)];
porA('El de la Llamada').mas = [tomaCarta(3), ['T32', [['hace', 'Más de cerca. En voz baja y sin prisa, mirando a la lente. Sin nombres ni casos.'], ['dice', DIFICILES]], 'miércoles 11:30']];
porA('La Arquitecta').mas = [tomaCarta(5)];
porA('Manos de Cempasúchil').mas = [tomaCarta(9)];
porA('El Turno de la Noche').mas = [tomaCarta(2)];
const RADIO = ['«Base Centinela a todas las unidades… ¿me copian?»', '«Unidad Blindaje Centinela, salida 19 de octubre. Destino: LOMAween.»',
  '«Base Centinela a Trabajo en Equipo, ¿me copias?»', '«Base Centinela a Enfoque a Resultados, ¿me copias?»', '«Base Centinela a Pasión, ¿me copias?»',
  '«Unidad Blindaje Centinela: llegó a destino.»', '«Cambio y fuera.»'];
const ET = { dice: '🗣 DICE', hace: '🎬 HACE', canta: '🎴 CANTA', voz: '📻 SOLO VOZ', imagen: '📷 IMAGEN' };
const et = k => `<span class="et ${k}">${ET[k]}</span>`;
const tx = (k, s) => `<span class="tx ${k}">${s}</span>`;
let kk = 0;
const mini = (n, w) => `<span class="mini"${w ? ` style="width:${w}px"` : ''}>${cartaSVG(CARTA[n]).replace(/papel(\d+)/g, 'papel$1_' + (++kk)).replace(/cBand/g, 'cBand' + kk)}</span>`;
